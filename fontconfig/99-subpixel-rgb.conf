<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Sub-pixel rendering, which Fedora enables for KDE and for nothing else.

    kde-settings ships /etc/fonts/conf.d/10-sub-pixel-rgb-for-kde.conf, and
    all it does is test the desktop name:

        <test name="desktop" compare="contains"><string>KDE</string></test>
        <edit name="rgba" mode="append"><const>rgb</const></edit>

    So Plasma gets sub-pixel rendering and a Hyprland or Sway session on the
    same release gets grey-scale antialiasing. Measured across these machines:

        Framework, Plasma     rgba: 1 (rgb)
        T480, Hyprland        rgba absent entirely - no rule active at all
        Desktop, NixOS        rgba: 5 (none) until set in the configuration

    That difference is most of why Plasma's text looked better, and none of
    it is about Wayland, the compositor, or the toolkit.

    APPENDED, NOT ASSIGNED, and that is copied from Fedora's own file for the
    reason its comment gives: a desktop that sets rgba itself should keep
    winning, because fontconfig takes the first value. On a machine where
    nothing sets it - every Hyprland session - this is the only value and
    applies. On a KDE machine it is a harmless duplicate.

    ONLY TRUE FOR AN RGB-STRIPED PANEL. Sub-pixel rendering places edges using
    the physical red/green/blue elements of an LCD, so a rotated screen wants
    "vrgb", some panels want "bgr", and OLEDs with unusual layouts want none of
    it. Text looks colour-fringed rather than sharper when this is wrong. All
    three machines here are ordinary RGB.
  -->
  <match target="font">
    <edit name="rgba" mode="append"><const>rgb</const></edit>
  </match>

  <!--
    The filter that stops sub-pixel rendering tinting the edges it sharpens.
    Fedora already sets this for everyone in 11-lcdfilter-default.conf, so this
    is here for machines whose distribution does not.
  -->
  <match target="font">
    <edit name="lcdfilter" mode="append"><const>lcddefault</const></edit>
  </match>
</fontconfig>
