<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Symbols Nerd Font as a LAST-RESORT fallback, so Nerd Font icons resolve in
    applications that do not do their own font fallback.

    Why it is needed: the icons in the tmux status bar (and in starship) are
    Material Design glyphs at U+F018D, U+F048B and friends, which live in
    plane-15 private use area. Exactly one installed font carries them -
    Symbols Nerd Font - and it is a symbols-only face, not a monospace one.
    kitty finds it by itself, which is why this never came up before; konsole
    goes through Qt and fontconfig, which would not reach it without this.

    APPENDED, not prepended, and binding="weak": the real font keeps every
    glyph it has, and this is consulted only for codepoints nothing else
    covers. Prepending would hand Symbols Nerd Font characters it draws at the
    wrong width, which is how this kind of rule usually ruins a terminal's
    column alignment.

    Both "monospace" and "sans-serif" are covered because the icons turn up in
    panels and menus too, not only in a terminal.
  -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font</string>
    </edit>
  </match>
</fontconfig>
