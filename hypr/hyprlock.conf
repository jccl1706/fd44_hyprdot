# =========================================================================
# hyprlock - the lock screen
# =========================================================================
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# Minimal on purpose. A flat themed field, the time set large and high, the
# date under it, the password low. No card, no panel, no frame - type and
# spacing do the work, and there are no proportions left to get wrong.
#
# This replaced an elevated-card design. The card was not wrong so much as
# unnecessary: a lock screen has exactly one control on it, and wrapping one
# control in a container makes it look like a dialog something else put there.
#
# COLOURS COME FROM THE ACTIVE THEME, not from this file. bin/theme.sh writes
# hyprlock-colors.conf next to this one out of themes/<name>.conf and it is
# sourced below. That file is generated and gitignored; edit the theme, not it.
#
# The source path is absolute. Hyprlang resolves `source` against the working
# directory, not against the file doing the sourcing, so a bare relative path
# silently fails to load - verified: "hyprlock-colors.conf" does not resolve,
# "$HOME/.config/hypr/hyprlock-colors.conf" does. hypridle starts hyprlock
# from somewhere unpredictable, so this has to be absolute.
#
# EVERY SETTING NEEDS ITS OWN LINE. Hyprlang does not treat ";" as a statement
# separator - it reads the rest of the line as part of the value, so
# `size = 320, 48; rounding = 24` fails with "cannot parse ... as an int".
#
# NO WALLPAPER BEHIND THIS, deliberately. A blurred screenshot would show the
# contents of whatever was open, and a blurred wallpaper would need this file
# to track a path the picker changes independently. A flat themed field is
# always correct and always matches the bar and the frame.
#
# TESTING A CHANGE WITHOUT LOCKING YOURSELF OUT:
#   WAYLAND_DISPLAY=nope hyprlock -c hypr/hyprlock.conf
# It parses the config, reports any errors, then exits because it cannot reach
# a compositor. Nothing locks.

source = $HOME/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    color = $bg
}

# --- time ----------------------------------------------------------------
#
# Positions are offsets from the centre of the screen. The clock sits above
# the centre rather than on it: centred exactly, the time reads as the subject
# of a dialog; high on the field it reads as a clock you happen to be able to
# type past.
#
# THE FAMILY NAME IS ALWAYS PLAIN "Inter Variable". Style words appended to
# it do not resolve: "Inter Variable Bold" and "Inter Variable Light" both
# fall back to Noto Sans - a different typeface entirely, silently, with no
# error. Only fontconfig's own "Inter Variable:weight=bold" syntax reaches the
# variable font's instances, and that is not what pango is being handed here.
#
# So WEIGHT COMES FROM PANGO MARKUP instead. hyprlock renders a label's text
# as markup, so the command emits a <span> and pango instantiates the weight
# off the variable font. This is the reliable half of the two below.
#
# "Inter Display" IS NOT INSTALLED - Fedora's rsms-inter-vf-fonts ships only
# InterVariable.ttf, and asking for Display falls back to Noto Sans like the
# rest. It is not needed: Display IS Inter's display optical size, and the
# variable font carries the opsz axis (14-32) that produces it. quickshell
# already does this in Clock.qml via font.variableAxes. The "@opsz=32" below
# is the pango spelling of the same request - it parses, but whether hyprlock
# passes the family through pango's description parser is unverified, so treat
# it as best-effort: if it is ignored the clock is simply Inter at its default
# optical size, which is what it was before.

# Lock glyph, centred above the clock. The same U+F033E the power menu uses
# for its Lock button, from the same Nerd Font the bar uses - so the icon that
# locks the machine and the icon on the locked machine are the same shape.
#
# $dim rather than $fg: it is a state indicator, not something to read. At
# full foreground weight it competes with the time directly above which it
# sits, and the time is the thing you are actually looking at.

label {
    monitor =
    text = 󰌾
    font_family = Symbols Nerd Font
    font_size = 30
    color = $dim
    position = 0, 330
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span weight='bold'>$(date +%H:%M)</span>"
    font_family = Inter Variable @opsz=32
    font_size = 128
    color = $fg
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600] date +"%A, %-d %B"
    font_family = Inter Variable
    font_size = 15
    color = $dim
    position = 0, 58
    halign = center
    valign = center
}

# --- password ------------------------------------------------------------
#
# Low on the field, well clear of the time. A pill: rounding is half the
# height, matching the bar's own pills rather than nearly matching them.

input-field {
    monitor =
    size = 320, 48
    rounding = 24
    outline_thickness = 2

    inner_color = $surfaceHigh
    outer_color = $outline
    font_color = $fg
    check_color = $accent
    fail_color = $danger
    capslock_color = $danger

    font_family = Inter Variable
    placeholder_text = <span foreground="##$dimHex">Password</span>
    fail_text = <span foreground="##$dangerHex">$FAIL</span>

    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    # The field stays visible when empty. fade_on_empty makes the only control
    # on the screen disappear whenever it is not being typed into, which looks
    # like the lock screen has stopped responding.
    fade_on_empty = false

    position = 0, -210
    halign = center
    valign = center
}
