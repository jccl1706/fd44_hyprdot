background {
    monitor =
    color   = rgba(1a1a1aff)
}
input-field {
    monitor           =
    size              = 300, 50
    outline_thickness = 2
    outer_color       = rgba(00000000)
    inner_color       = rgba(ffffff1a)
    font_color        = rgb(cccccc)
    fade_on_empty     = false
    placeholder_text  = <i>Password…</i>
    position          = 0, -20
    halign            = center
    valign            = center
}
label {
    monitor   =
    text      = cmd[update:1000] date +"%H:%M"
    font_size = 55
    color     = rgb(cccccc)
    position  = 0, 100
    halign    = center
    valign    = center
}