# =========================================================================
# hyprlock - the lock screen
# =========================================================================
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# Material in the sense that matters here: one tonal surface lifted off the
# background by a shadow rather than by a border, a clear type scale, a single
# accent, and generous rounding. Not a photograph with a blur over it.
#
# COLOURS COME FROM THE ACTIVE THEME, not from this file. bin/theme.sh writes
# hyprlock-colors.conf next to this one out of themes/<name>.conf, and it is
# sourced below. That file is generated and gitignored; edit the theme, not it.
#
# The source path is absolute. Hyprlang resolves `source` against the working
# directory, not against the file doing the sourcing, so a bare relative path
# silently fails to load - verified: "hyprlock-colors.conf" does not resolve,
# "$HOME/.config/hypr/hyprlock-colors.conf" does.
#
# EVERY SETTING NEEDS ITS OWN LINE. Hyprlang does not treat ";" as a statement
# separator - it reads the rest of the line as part of the value, so
# `size = 440, 300; rounding = 28` fails with "cannot parse ... as an int".
#
# NO WALLPAPER BEHIND THIS, deliberately. A blurred screenshot would show the
# contents of whatever was open, and a blurred wallpaper would need this file
# to track a path that the picker changes independently. A flat themed surface
# is always correct and always matches the bar and frame.
#
# TESTING A CHANGE WITHOUT LOCKING YOURSELF OUT:
#   WAYLAND_DISPLAY=nope hyprlock -c hypr/hyprlock.conf
# It parses the config, reports any errors, then exits because it cannot reach
# a compositor. Nothing locks.

source = $HOME/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

# --- background ----------------------------------------------------------

background {
    monitor =
    color = $bg
}

# --- the card ------------------------------------------------------------
#
# Lifted by a shadow rather than by contrast: on the cream theme the surface
# and the background are only a few percent apart, and a card that relies on
# tone alone disappears there. A shadow reads as elevation on both.

shape {
    monitor =
    size = 460, 340
    rounding = 28
    color = $surface
    border_size = 1
    border_color = $outline
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 14
    shadow_color = $shadow
    shadow_boost = 1.2
}

# --- contents ------------------------------------------------------------
#
# Positions are relative to the centre of the screen, which is also the centre
# of the card, so they read as offsets within it: the card spans -170 to +170.

# Lock glyph, from the same Nerd Font the bar uses.
label {
    monitor =
    text = 󰌾
    font_family = Symbols Nerd Font
    font_size = 26
    color = $dim
    position = 0, 112
    halign = center
    valign = center
}

# The clock. Light weight at display size - the same rule the bar follows,
# where weight comes down as size goes up.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = Inter Variable Light
    font_size = 64
    color = $fg
    position = 0, 42
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600] date +"%A, %-d %B"
    font_family = Inter Variable
    font_size = 13
    color = $dim
    position = 0, -8
    halign = center
    valign = center
}

# --- password ------------------------------------------------------------
#
# A pill: rounding is half the height, so it matches the bar's own pills
# rather than being a rounded rectangle that nearly matches them.

input-field {
    monitor =
    size = 320, 48
    rounding = 24
    outline_thickness = 2

    inner_color = $surfaceHigh
    outer_color = $outline
    font_color = $fg
    check_color = $accent
    fail_color = $danger
    capslock_color = $danger

    font_family = Inter Variable
    placeholder_text = <span foreground="##$dimHex">Password</span>
    fail_text = <span foreground="##$dangerHex">$FAIL</span>

    # Dots rather than characters, centred, sized to the pill.
    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    # The field stays visible when empty. fade_on_empty makes the one control
    # on the screen disappear whenever it is not being typed into, which looks
    # like the lock screen has stopped responding.
    fade_on_empty = false

    position = 0, -92
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shadow
}
