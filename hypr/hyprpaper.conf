# =========================================================================
# hyprpaper - the wallpaper daemon
# =========================================================================
#
# Deliberately almost empty. The wallpaper in use is NOT set here.
#
# It is applied at runtime instead, by bin/wallpaper.sh, which both pokes
# hyprpaper over IPC and records the choice in ~/.local/state. Two reasons:
#
#   - This file is tracked in git. Writing the current wallpaper into it
#     would mean every click in the picker dirties the working tree.
#   - hyprctl hyprpaper wallpaper loads a path whether or not it was
#     preloaded here (verified on 0.8.4), so a preload list would be
#     duplicated bookkeeping that the picker does not need.

# Required for `hyprctl hyprpaper` to reach the daemon at all.
ipc = on

# No hyprpaper splash text over the wallpaper.
splash = false

# Unload an image once it is no longer displayed. Without this every
# wallpaper ever selected stays decoded in RAM for the session - which, with
# a picker that makes switching a single keypress, adds up quickly.
ipc_unload_unused = true
