# hypridle - idle management
#
# Lock is always at 5 minutes. Only the display-off timeout follows the power
# source:
#   lock           5 min, regardless of power source
#   display off    5:30 on battery, 15:30 on AC
#
# Rather than swapping config files and restarting hypridle whenever the
# charger moves, every listener is always armed and the battery-scoped ones
# check the power source when they fire. On AC they do nothing and the later
# unconditional listeners handle it. One config, no restarts, and no race if
# the charger is plugged or unplugged while a timer is already running.
#
# THE 30 SECOND GAP BETWEEN LOCK AND BLANK IS LOAD-BEARING.
# hyprlock needs time to initialise and paint before the output is powered
# off. Doing both at once means hyprlock never gets a frame callback, and the
# later `dpms on` powers the panel back up with nothing drawn on it: the
# screen stays black even though the dispatch returns "ok" and hypridle's
# on-resume ran correctly. This was observed on 2026-09-11 after collapsing
# the two into one action - the display never recovered and the only way back
# was a VT switch. Hyprland's own stock config staggers them for this reason.
#
# On battery the 15/15.5 minute listeners still fire, but by then the session
# is locked and the display already off. Both actions are idempotent, so that
# is harmless.
#
# Logic lives in bin/idle-action.sh - testable without waiting:
#     bin/idle-action.sh lock battery --dry-run
#     bin/idle-action.sh blank always --dry-run
#
# NOTE: do NOT write `hyprctl dispatch dpms off` here, which is what almost
# every hypridle example online uses. On Hyprland 0.56 `hyprctl dispatch`
# evaluates Lua, so that form is a parse error - and it fails silently, with
# hypridle reporting it ran the command while the screen never blanks.

general {
    # hyprlock is launched into its OWN systemd scope, not as a plain child of
    # hypridle. Without this it inherits hypridle.service's cgroup, so any
    # `systemctl --user restart hypridle` - including a routine one after
    # editing these timeouts - kills the running lock screen and leaves the
    # desktop sitting behind a stale frame. That is a security hole, not just
    # an annoyance. Verified: a process in its own scope survives a hypridle
    # restart; a plain child does not.
    lock_cmd         = pidof hyprlock || systemd-run --user --scope --quiet --collect --unit=hyprlock hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = $HOME/.config/hypr/../bin/idle-action.sh wake
}

# --- lock: 5 minutes, regardless of power source --------------------------
#
# Only one lock listener is needed. Locking is not power-dependent, so there
# is nothing for a battery-scoped variant to do that this does not already
# cover.

listener {
    timeout    = 300
    on-timeout = $HOME/.config/hypr/../bin/idle-action.sh lock always
}

# --- display off: 5:30 on battery, 15:30 on AC ----------------------------
#
# Both are comfortably past the 5:00 lock, so hyprlock has painted long before
# either fires - on AC by more than ten minutes.

listener {
    timeout    = 330
    on-timeout = $HOME/.config/hypr/../bin/idle-action.sh blank battery
    on-resume  = $HOME/.config/hypr/../bin/idle-action.sh wake
}

listener {
    timeout    = 930
    on-timeout = $HOME/.config/hypr/../bin/idle-action.sh blank always
    on-resume  = $HOME/.config/hypr/../bin/idle-action.sh wake
}

# --- suspend: 15 minutes, battery only ------------------------------------
#
# On AC the machine deliberately stays awake - long downloads, builds and ssh
# sessions should not be cut off just because nobody touched the keyboard.
# Closing the lid still suspends on AC; that is logind's
# HandleLidSwitchExternalPower=suspend, configured separately in logind.conf
# and nothing to do with hypridle.
#
# No on-resume here: hypridle's after_sleep_cmd already wakes the display when
# the machine comes back.
#
# `systemctl suspend` goes through logind, so inhibitors are honoured - a
# "block" inhibitor (video playback, a deliberate systemd-inhibit) prevents it
# entirely, while "delay" inhibitors just postpone it. Verified this user may
# suspend without root: pkcheck org.freedesktop.login1.suspend returns 0.
#
# Suspend on this machine is s2idle and is known good: an unattended overnight
# lid-close suspend ran 23:05 -> 08:07 and resumed cleanly (amdgpu SMU resumed,
# NVMe re-enumerated, bluetooth back).

listener {
    timeout    = 900
    on-timeout = $HOME/.config/hypr/../bin/idle-action.sh suspend battery
}
