# hypridle - idle management
#
# Both lock and screen-off follow the power source:
#   on battery    5 minutes
#   on AC        15 minutes
#
# Rather than swapping config files and restarting hypridle whenever the
# charger moves, both listeners are always armed and the 5-minute one checks
# the power source when it fires. On AC it does nothing and the 15-minute
# listener handles it instead. One config, no restarts, and no race if the
# charger is plugged or unplugged while a timer is already running.
#
# ACAD/online is 1 on AC, 0 on battery.
#
# On battery the 15-minute listener still fires, but by then the session is
# already locked and the screen already off. Both actions are idempotent -
# lock_cmd guards with `pidof hyprlock`, and dpms off on an already-off output
# is a no-op - so this is harmless.

general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# 5 minutes - battery only. Lock first, then blank, so the unlocked desktop is
# never briefly visible if the screen comes back.
listener {
    timeout    = 300
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/ACAD/online)" = "0" ] && { loginctl lock-session; hyprctl dispatch dpms off; }'
    on-resume  = hyprctl dispatch dpms on
}

# 15 minutes - unconditional. This is the one that fires on AC.
listener {
    timeout    = 900
    on-timeout = sh -c 'loginctl lock-session; hyprctl dispatch dpms off'
    on-resume  = hyprctl dispatch dpms on
}
