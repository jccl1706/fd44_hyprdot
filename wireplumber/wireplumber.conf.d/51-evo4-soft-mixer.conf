# Audient EVO4: volume in SOFTWARE, never on the interface's own control.
#
# By default PipeWire drives the EVO4's hardware mixer ('EVO4  Playback
# Volume', 0-254 = -127..0 dB), so every volume change is a USB control
# request to the interface. One at a time that is fine. A slider sends a
# stream of them - measured flipping the control 178 <-> 182 thirty times a
# second - and the EVO4 cuts out while it is being hammered like that.
#
# With the soft mixer PipeWire scales the samples itself and leaves the
# hardware control where it was put. It sits at 0 dB (254), so 100% in
# software is the interface's full output, exactly as before. The level is
# kept across reboots and replugs by alsa-state / 90-alsa-restore.rules.
# Set it by hand, if ever needed:  amixer -c EVO4 cset numid=4 254,254
# (amixer answers "Invalid argument" for the two unused aux channels; the
# first two are still written - check with `amixer -c EVO4 cget numid=4`).
#
# The physical knob still works - it is the hardware stage, after this one.
#
# Matches only the EVO4, so this file does nothing on the laptop.
# Linked into ~/.config/wireplumber/wireplumber.conf.d/ - see the README.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-Audient_EVO4-00" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
