# =========================================================================
# daylight/slots.conf - which wallpaper, and which palette, at what hour
# =========================================================================
#
# Read by bin/daylight.py. Plain key=value, the same shape as themes/*.conf,
# so both a shell and a QML file could parse it if either ever needs to.
#
# THE SLOTS ARE ANCHORED TO THE SUN, not to the clock:
#
#   morning   sunrise - 30m  ->  sunrise + 2h
#   day       sunrise + 2h   ->  sunset  - 90m
#   evening   sunset  - 90m  ->  sunset  + 30m
#   night     everything else
#
# CHOSEN BY MEASURED BRIGHTNESS, not by name. The four sit on a curve that
# descends with the light - roughly 178, 162, 88 and 14 out of 255 average
# luminance - because a wallpaper that is right at noon glares in a dark room.
#
# The set before this one did neither: day was flexoki-light-orb at 248, the
# second brightest of all sixty-three and twice anything beside it, and night
# was BRIGHTER than evening (103 against 81). Reported as the day wallpaper
# being too bright, which it measurably was.
#
# Wallpaper names are files in wallpapers/. Themes are files in themes/.
# Leave a value empty and that slot changes nothing - `night_theme=` would
# follow the sun with the wallpaper and leave the palette alone.
#
# THE THEMES ARE ALL EMPTY HERE ON PURPOSE: the wallpaper follows the sun and
# the palette does not. Having the desktop go cream at breakfast and dark at
# dusk sounds right and reads as the machine changing its mind under you,
# especially mid-task. Put a theme name back beside any slot to have that one
# switch the palette again - they are independent, one slot at a time.

# --- where the sun is -----------------------------------------------------
#
# Left unset, the location comes from the timezone database: zone1970.tab
# gives a latitude and longitude for every zone, and America/New_York answers
# 40.71, -74.01. That is the zone's city, not necessarily yours - a degree of
# longitude is four minutes of sunrise, so set these if you are far from it.
#
# latitude  = 40.71
# longitude = -74.01

# --- morning: first light ------------------------------------------------
morning_wallpaper = lupine-cherry-blossom-bokeh.webp
morning_theme     =
# --- day -----------------------------------------------------------------
day_wallpaper     = kanagawa-kanagawa.webp
day_theme         =
# --- evening: the hour before the sun goes --------------------------------
evening_wallpaper = retro-82-dusk-guardian.webp
evening_theme     =
# --- night ---------------------------------------------------------------
night_wallpaper   = matte-black-dark-waters.webp
night_theme       =