# =========================================================================
# daylight/slots.conf - how often the wallpaper changes, and the palette
# =========================================================================
#
# Read by bin/daylight.py. Plain key=value, the same shape as themes/*.conf,
# so both a shell and a QML file could parse it if either ever needs to.
#
# --- the wallpaper --------------------------------------------------------
#
# A RANDOM ONE, EVERY interval_minutes. There is no list here any more: the
# whole of wallpapers/ is the list, and the point is to see all of it rather
# than the same four pictures the fixed slots used to show.
#
# AT NIGHT IT PICKS FROM THE DARKER HALF ONLY, by measured luminance - dwebp
# decodes each file to 64x36 once and the numbers are cached. Unconstrained
# random puts a 249-luminance picture on screen at two in the morning, and a
# wallpaper that is right at noon glares in a dark room. That fault was
# reported once already and is not worth reintroducing for the sake of being
# random. "Night" is the sun's, not the clock's - the night slot below.
#
# A MANUAL CHOICE WINS UNTIL TOMORROW. Pick one in the wallpaper picker and
# the rotation leaves it alone for the rest of the day, so this cannot take
# away a wallpaper you chose on purpose. It resumes in the morning.
#
# Set interval_minutes very large to stop the rotation without disabling the
# timer, which is still what switches the palette if you give it slots.

interval_minutes = 60

# --- where the sun is -----------------------------------------------------
#
# New York City. SET DOWN HERE RATHER THAN LEFT TO THE TIMEZONE, which would
# answer the same thing today: zone1970.tab gives every zone a latitude and
# longitude, and America/New_York happens to be the city itself. Writing it
# here means a change of timezone - travelling, or a reinstall that guesses
# differently - moves the clock without quietly moving the sun with it.
#
# A degree of longitude is four minutes of sunrise, so these are worth
# changing if the machine settles somewhere else.

latitude  = 40.71
longitude = -74.01

# --- the palette ----------------------------------------------------------
#
# THE SLOTS ARE ANCHORED TO THE SUN, not to the clock:
#
#   morning   sunrise - 30m  ->  sunrise + 2h
#   day       sunrise + 2h   ->  sunset  - 90m
#   evening   sunset  - 90m  ->  sunset  + 30m
#   night     everything else
#
# THESE ARE ALL EMPTY ON PURPOSE: the wallpaper moves and the palette does
# not. Having the desktop go cream at breakfast and dark at dusk sounds right
# and reads as the machine changing its mind under you, especially mid-task.
# Put a theme name from themes/ beside any slot to have that one switch the
# palette again - they are independent, one slot at a time.

morning_theme =
day_theme     =
evening_theme =
night_theme   =
