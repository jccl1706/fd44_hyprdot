# =========================================================================
# /etc/portage/make.conf - gaming00, Ryzen 7 9800X3D + RTX 5090, OpenRC
# =========================================================================
#
# Written for one machine and not portable: -march and MAKEOPTS both assume
# this CPU, and VIDEO_CARDS assumes this GPU. From fd44_hyprdot/gentoo/.

# --- the compiler ---------------------------------------------------------
#
# znver5 for the 9800X3D, confirmed supported by the stage3's gcc 16.2.1
# before being set - an unsupported -march fails at the first package and is a
# miserable thing to debug from inside a chroot.
#
# -O2 AND NOT -O3, deliberately. -O3 is rarely measurably faster for desktop
# code, occasionally miscompiles, and Gentoo closes bugs reported against it.
# The win here is -march, which is real; -O3 mostly is not.
COMMON_FLAGS="-march=znver5 -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="-Wl,-O1 -Wl,--as-needed"

# GENERATE THIS, DO NOT COPY IT. Inside the chroot:
#     emerge --oneshot app-portage/cpuid2cpuflags && cpuid2cpuflags
# then paste the line it prints over the one below. Hand-writing it is how a
# build ends up assuming instructions the CPU does not have.
# CPU_FLAGS_X86="..."

# --- how much to build at once --------------------------------------------
#
# 8 cores, 16 threads. -l18 caps the load so one heavy package does not make
# the machine unusable while it builds; without it a -j16 link storm will.
MAKEOPTS="-j16 -l18"

# --keep-going finishes the other 400 packages when one fails, which matters
# on a first @world. --with-bdeps=y keeps build-time dependencies so a later
# --depclean does not remove something the next rebuild needs.
#
# --jobs=4 BECAUSE MAKEOPTS ALONE LEAVES THIS MACHINE IDLE. Portage builds one
# package at a time, and most of a KDE tree is small packages that cannot use
# sixteen threads - measured during the first world build, the load average sat
# at 3.5 on 16 cores. Four packages at once fixes that, and --load-average=16
# stops it thrashing on the occasions when all four happen to be large.
EMERGE_DEFAULT_OPTS="--keep-going --with-bdeps=y --jobs=4 --load-average=16"

# buildpkg makes a binary package of everything as it goes. It costs disk and
# saves hours the first time a USE change forces a large rebuild - and on a
# source distribution that is not an if.
FEATURES="parallel-fetch buildpkg"

# --- USE ------------------------------------------------------------------
#
# The desktop/plasma profile already sets most of what a KDE system wants, so
# these are deltas rather than a full list.
#
# elogind and -systemd are the pair that make OpenRC work with Plasma: logind
# provides seats and sessions, and Plasma requires one.
USE="wayland elogind pipewire vulkan networkmanager bluetooth -systemd"

# nvidia, and NOT nouveau - they fight, and the RTX 5090 needs the open
# kernel modules from nvidia-drivers rather than anything in tree.
VIDEO_CARDS="nvidia"
INPUT_DEVICES="libinput"

# --- licences -------------------------------------------------------------
#
# NVIDIA-r2 IS MANDATORY HERE. Without it nvidia-drivers refuses to emerge and
# the message does not make the reason obvious.
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE NVIDIA-r2"
ACCEPT_KEYWORDS="amd64"

# --- bootloader -----------------------------------------------------------
# UEFI only. Secure Boot is disabled on this board, so nothing needs signing.
GRUB_PLATFORMS="efi-64"

# --- the rest -------------------------------------------------------------
PORTDIR="/var/db/repos/gentoo"
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"
PORTAGE_TMPDIR="/var/tmp"

L10N="en"
LC_MESSAGES=C.utf8
GENTOO_MIRRORS="https://distfiles.gentoo.org"
