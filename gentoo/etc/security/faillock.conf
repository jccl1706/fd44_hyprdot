# Lockout policy after repeated authentication failures.
#
# Written after a resume locked jc out for ten minutes: Plasma's lock screen on
# Wayland can paint before keyboard input is wired up, so the first Enter
# submits an empty field. PAM logs that as "conversation failed / could not
# identify password" and pam_faillock counts it like a wrong password. Two of
# those phantom failures plus one real typo hit the built-in deny=3 and the
# account was held for the built-in unlock_time=600.
#
# This is a desktop in a house: the lock screen already requires someone to be
# sitting at it, so the built-in defaults are tuned for a machine facing the
# internet rather than for this one. Five attempts and two minutes still stops
# somebody guessing passwords by hand, without charging ten minutes for a quirk
# in the greeter.
#
# Deliberately NOT set: even_deny_root, so a locked-out desktop user can always
# be recovered from a root console or over ssh.
deny = 5
unlock_time = 120
