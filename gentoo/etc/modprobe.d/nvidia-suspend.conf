# Local additions to nvidia.conf, kept separate so a package update never
# fights with them - nvidia.conf belongs to x11-drivers/nvidia-drivers and is
# replaced on every upgrade. Writing these into that file once already cost
# the nouveau blacklist and the device-file permissions it ships.
#
# Verified on 2026-10-16 with rtcwake -m mem -s 30: the session survived with
# the same PIDs and no NVRM errors. See docs/gentoo-gaming00-plan.md.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_UseKernelSuspendNotifiers=1
options nvidia NVreg_TemporaryFilePath=/var/tmp
