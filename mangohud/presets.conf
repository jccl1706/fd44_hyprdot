# =========================================================================
# MangoHud layouts - see MangoHud.conf for the keys
# =========================================================================
#
# Colours are the dark theme's (themes/dark.conf), fixed rather than following
# the theme switch - the overlay sits on a game, not on the desktop:
#   GPU green a6e3a1 · CPU blue 89b4fa · VRAM pink f5c2e7 · RAM yellow f9e2af
#
# FPS changes colour against the 120 fps cap (bin/gaming-setup.sh): red below
# 60, yellow from 60, green from 100.
#
# JetBrains Mono Bold, so the numbers keep their width and the line does not
# jitter as they change. The installer puts that font on every machine.

# --- 1: the compact bar -------------------------------------------------
#   GPU 97% 71°C 285W | CPU 45% 68°C 88W | VRAM 9.8G | RAM 14G | 119 FPS 1% 104 | 8.3ms
[preset 1]
horizontal
# Background fits the text. MangoHud's default stretches a horizontal bar's
# background across the whole width of the screen.
horizontal_stretch=0
hud_compact
position=top-left
round_corners=8
background_color=11111b
background_alpha=0.55
text_color=cdd6f4
font_file=/usr/share/fonts/jetbrains-mono-fonts/JetBrainsMono-Bold.otf
font_size=18

gpu_stats
gpu_text=GPU
gpu_color=a6e3a1
gpu_temp
gpu_power
cpu_stats
cpu_text=CPU
cpu_color=89b4fa
cpu_temp
cpu_power
vram
vram_color=f5c2e7
ram
ram_color=f9e2af
fps
fps_metrics=0.01
fps_color_change
fps_color=f38ba8,f9e2af,a6e3a1
fps_value=60,100
frametime
frame_timing=0

# --- 2: the detailed panel ----------------------------------------------
#   one row per part, the GPU's junction and memory temperatures and fan,
#   average FPS beside the 1% low, and a frametime graph
[preset 2]
position=top-left
round_corners=8
background_color=11111b
background_alpha=0.6
text_color=cdd6f4
font_file=/usr/share/fonts/jetbrains-mono-fonts/JetBrainsMono-Bold.otf
font_size=20

gpu_name
gpu_stats
gpu_text=GPU
gpu_color=a6e3a1
gpu_temp
gpu_junction_temp
gpu_mem_temp
gpu_power
gpu_fan
vram
vram_color=f5c2e7
cpu_stats
cpu_text=CPU
cpu_color=89b4fa
cpu_temp
cpu_power
ram
ram_color=f9e2af
fps
fps_metrics=avg,0.01
fps_color_change
fps_color=f38ba8,f9e2af,a6e3a1
fps_value=60,100
frametime
frame_timing
frametime_color=a6e3a1
