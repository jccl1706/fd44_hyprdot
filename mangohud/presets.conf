# =========================================================================
# MangoHud layouts - see MangoHud.conf for the keys
# =========================================================================
#
# Colours are the dark theme's (themes/dark.conf), fixed rather than following
# the theme switch - the overlay sits on a game, not on the desktop:
#   GPU green a6e3a1 · CPU blue 89b4fa · VRAM pink f5c2e7 · RAM yellow f9e2af
#
# FPS changes colour against the 120 fps cap (bin/gaming-setup.sh): red below
# 60, yellow from 60, green from 100.
#
# JetBrains Mono Bold, so the numbers keep their width and the line does not
# jitter as they change. The installer puts that font on every machine.

# --- 1: the compact bar -------------------------------------------------
#   GPU 97% 71°C 285W | CPU 45% 68°C 88W | VRAM 9.8G | RAM 14G | 119 FPS 1% 104 | 8.3ms
[preset 1]
horizontal
hud_compact
position=top-left
# 4 px from the corner instead of MangoHud's 10 px margin, so the red "logging"
# dot fits on screen. The dot is drawn 15 px in from the right edge of the
# overlay's window, and a horizontal bar's window is the full screen width - the
# default margin pushed it past the edge, cut off. Any offset turns that margin
# off; 4 is the most that still leaves room for the whole 20 px dot.
offset_x=4
offset_y=4
# NO BACKGROUND BOX: outlined text instead. MangoHud 0.8.3 cannot centre the
# text in a horizontal bar's box - it sizes the box as the text's height plus a
# fixed 11 px, and its width as an estimate of 64 px per column (overlay.cpp,
# render_imgui). Measured over Cyberpunk 2077: 1 px of box above and left of
# the text, 18 px below and 20 px to the right. With no box there is nothing
# to be off-centre, and the outline keeps the text readable on bright scenes.
background_alpha=0
text_outline
text_outline_color=11111b
text_outline_thickness=2
text_color=cdd6f4
font_file=/home/jc/Work/fd44_hyprdot/fonts/jetbrains-mono/JetBrainsMono-Bold.otf
font_size=18

gpu_stats
gpu_text=GPU
gpu_color=a6e3a1
gpu_temp
gpu_power
cpu_stats
cpu_text=CPU
cpu_color=89b4fa
cpu_temp
cpu_power
vram
vram_color=f5c2e7
ram
ram_color=f9e2af
fps
fps_metrics=0.01
fps_color_change
fps_color=f38ba8,f9e2af,a6e3a1
fps_value=60,100
frametime
frame_timing=0

# --- 2: the detailed panel ----------------------------------------------
#   one row per part, the GPU's junction and memory temperatures and fan,
#   average FPS beside the 1% low, and a frametime graph
[preset 2]
position=top-left
round_corners=8
background_color=11111b
background_alpha=0.6
text_color=cdd6f4
font_file=/home/jc/Work/fd44_hyprdot/fonts/jetbrains-mono/JetBrainsMono-Bold.otf
font_size=20

gpu_name
gpu_stats
gpu_text=GPU
gpu_color=a6e3a1
gpu_temp
gpu_junction_temp
gpu_mem_temp
gpu_power
gpu_fan
vram
vram_color=f5c2e7
cpu_stats
cpu_text=CPU
cpu_color=89b4fa
cpu_temp
cpu_power
ram
ram_color=f9e2af
fps
fps_metrics=avg,0.01
fps_color_change
fps_color=f38ba8,f9e2af,a6e3a1
fps_value=60,100
frametime
frame_timing
frametime_color=a6e3a1
