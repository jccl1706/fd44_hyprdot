# =========================================================================
# MangoHud - the in-game overlay (gaming desktop)
# =========================================================================
#
# Linked to ~/.config/MangoHud/MangoHud.conf by bin/gaming-setup.sh, together
# with presets.conf beside it. Turned on per game, in Steam's launch options:
#
#     mangohud gamemoderun %command%
#
# Keys, while the game has focus:
#     Right Shift + F12   show / hide the overlay
#     Right Shift + F10   switch between the compact bar and the detailed panel
#     Right Shift + F1    lift the 60 fps cap, and put it back
#
# The layouts themselves are in presets.conf: [preset 1] is the compact bar,
# [preset 2] the detailed panel. `preset` lists the ones F10 cycles through,
# and the first is what a game starts with.
#
# LOGGING
#     Left Shift + F2     start / stop logging every frame to ~/<game>_<date>.csv
# When it stops, a "Logging Finished" window shows the run's duration and 1% low.
# That window used to abort the game: Fedora 44's MangoHud 0.8.3-rc1 drew it
# with an empty ImGui label and kept ImGui's assertions on. gaming-setup.sh
# installs MangoHud from Bazzite's COPR instead - 0.8.4, with upstream's fix -
# and explains the choice.
#
# The on-screen 1% low is the 99th-percentile frame time of the last 10,000
# frames as FPS - not an average of the slowest 1%, which reads a little lower.
# Right Shift + F9 resets it. Checked against a 3-minute Cyberpunk 2077 log:
# recomputed from the frames, it matched MangoHud's own figure exactly.
#
# CPU power needs the CPU's RAPL energy counter, which the kernel makes
# root-only. gaming-setup.sh adds a udev rule letting the gamemode group read
# it; without that rule CPU power stays blank and everything else still works.
#
# COMPARING TWO SYSTEMS (this repo runs on Fedora and on NixOS, sharing one
# Steam library, so the same game can be measured on both). Logs go to one
# folder rather than $HOME, and every frame is recorded - log_interval must
# stay 0, because any interval averages frames together and a 1% low computed
# from averaged samples is not a 1% low.
#
# Do NOT autostart logging here: it would log every game you ever launch. Ask
# for it per run instead, in Steam's launch options:
#
#     VKD3D_FRAME_RATE=0 DXVK_CONFIG= \
#     MANGOHUD_CONFIG=output_folder=/home/jc/mangohud-logs,log_interval=0 \
#     mangohud %command%
#
# then Left Shift + F2 at the start of the benchmark scene and again at the
# end. Three things in that line were each learned the hard way:
#
#   MANGOHUD_CONFIG REPLACES this file, it does not merge with it. A launch
#   option of just autostart_log=... silently dropped output_folder and wrote
#   the CSVs to $HOME. Anything this file sets that the run needs has to be
#   repeated in the variable.
#
#   autostart_log is WRONG for a benchmark you trigger from a menu. It starts
#   counting when the game starts, so a 60-second window captured the launcher
#   and the main menu - 120 fps at 64% GPU load - and finished before the
#   benchmark did. F2 by hand marks the scene itself.
#
#   The frame cap is NOT removed by renaming ~/.config/uwsm/env.d/gaming.
#   uwsm exports it into the systemd user manager, which survives logout
#   (autologin returns faster than logind's user-stop delay, so the manager
#   never stops - the same persistence gaming-setup.sh documents for group
#   membership). Measured: the file renamed at 08:16, a fresh tty1 login at
#   08:17, and the game still started with VKD3D_FRAME_RATE=120. Overriding it
#   per launch as above is reliable; `systemctl --user unset-environment
#   VKD3D_FRAME_RATE DXVK_CONFIG` or a reboot also work.
#
# Use a deterministic scene - Cyberpunk 2077's built-in benchmark, not a
# multiplayer match. bin/fps-compare.sh reads the resulting CSVs.

# THE FRAME CAP, and why it is here rather than anywhere else.
#
# Measured during Cyberpunk 2077 on nixos-gaming00: the card drew 412 W median
# and 552 W peak, and its own fan - which nothing in this repo controls, it runs
# on the card's firmware curve - sat at 68-70%. That fan is the noise in the
# machine; the case fans were at 43% beside it. The card was not hot doing it
# either: 63 C median with 20 C of headroom. It was simply moving the heat of
# half a kilowatt.
#
# A frame cap is the one lever that costs nothing else. The monitor is 144 Hz
# and the game was rendering well past it in places - watts spent on frames
# that are never displayed. Capping at 60 goes further than that and trades
# frames for quiet deliberately, which is the trade asked for.
#
# MANGOHUD RATHER THAN VKD3D_FRAME_RATE, which is what the benchmark notes
# above wrestle with. That variable is API-specific - DXVK needs its own - and
# uwsm exports it into the systemd user manager where it survives logout and
# takes a reboot or an explicit unset-environment to clear. MangoHud's limiter
# is one line in a file, applies to DXVK, VKD3D and OpenGL alike, and is
# already in every game through the launch options.
#
# 72 FIRST, NOT 60, and the reason is arithmetic rather than taste. The panel
# is 144 Hz. 144/60 is 2.4, so a 60 fps frame is held for two refreshes and
# then three, alternating - a steady frame RATE with unsteady frame TIMING,
# which is what "60 feels choppy" is. 72 is exactly half of 144: every frame
# gets two refreshes, forever, and it is smooth whether or not VRR engages.
#
# FRAME PACING: `late` rather than the default. MangoHud's early limiter sleeps
# BEFORE rendering a frame, which delivers frames uneven even when the rate is
# right; late sleeps after, and paces much more evenly. It matters more with a
# cap well under what the machine could do, which is the case here.
#
# VRR is on (misc:vrr = 2 in hypr/monitors.lua, fullscreen only) and the monitor
# reports it active, so in principle any cap should look smooth. In practice
# Cyberpunk sets itself BorderlessWindowed, and a composited borderless surface
# gets VRR less reliably than a true fullscreen one - so it is worth not relying
# on it. 72 does not need it.
#
# THREE VALUES, so the trade can be found without editing anything. Right Shift
# + F1 cycles 72 -> 60 -> uncapped -> 72: smooth, quietest, and the setting
# benchmarks need, since bin/fps-compare.sh is worthless against a capped run.
fps_limit=72,60,0
fps_limit_method=late
toggle_fps_limit=Shift_R+F1

output_folder=/home/jc/mangohud-logs
log_interval=0

preset=1,2
toggle_hud=Shift_R+F12
toggle_preset=Shift_R+F10
