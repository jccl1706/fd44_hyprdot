# =========================================================================
# MangoHud - the in-game overlay (gaming desktop)
# =========================================================================
#
# Linked to ~/.config/MangoHud/MangoHud.conf by bin/gaming-setup.sh, together
# with presets.conf beside it. Turned on per game, in Steam's launch options:
#
#     mangohud gamemoderun %command%
#
# Keys, while the game has focus:
#     Right Shift + F12   show / hide the overlay
#     Right Shift + F10   switch between the compact bar and the detailed panel
#
# The layouts themselves are in presets.conf: [preset 1] is the compact bar,
# [preset 2] the detailed panel. `preset` lists the ones F10 cycles through,
# and the first is what a game starts with.
#
# LOGGING
#     Left Shift + F2     start / stop logging every frame to ~/<game>_<date>.csv
# When it stops, a "Logging Finished" window shows the run's duration and 1% low.
# That window used to abort the game: Fedora 44's MangoHud 0.8.3-rc1 drew it
# with an empty ImGui label and kept ImGui's assertions on. gaming-setup.sh
# installs MangoHud from Bazzite's COPR instead - 0.8.4, with upstream's fix -
# and explains the choice.
#
# The on-screen 1% low is the 99th-percentile frame time of the last 10,000
# frames as FPS - not an average of the slowest 1%, which reads a little lower.
# Right Shift + F9 resets it. Checked against a 3-minute Cyberpunk 2077 log:
# recomputed from the frames, it matched MangoHud's own figure exactly.
#
# CPU power needs the CPU's RAPL energy counter, which the kernel makes
# root-only. gaming-setup.sh adds a udev rule letting the gamemode group read
# it; without that rule CPU power stays blank and everything else still works.
#
# COMPARING TWO SYSTEMS (this repo runs on Fedora and on NixOS, sharing one
# Steam library, so the same game can be measured on both). Logs go to one
# folder rather than $HOME, and every frame is recorded - log_interval must
# stay 0, because any interval averages frames together and a 1% low computed
# from averaged samples is not a 1% low.
#
# Do NOT autostart logging here: it would log every game you ever launch. Ask
# for it per run instead, in Steam's launch options, which also makes both
# runs the same length without you timing anything:
#
#     MANGOHUD_CONFIG=autostart_log=5,log_duration=60 mangohud fd44-gamemode-hold %command%
#
# Use a deterministic scene - Cyberpunk 2077's built-in benchmark, not a
# multiplayer match - and equalise the frame cap first: gaming-setup.sh caps
# Fedora at 120 fps through ~/.config/uwsm/env.d/gaming, and nothing caps
# NixOS. bin/fps-compare.sh reads the resulting CSVs.

output_folder=/home/jc/mangohud-logs
log_interval=0

preset=1,2
toggle_hud=Shift_R+F12
toggle_preset=Shift_R+F10
