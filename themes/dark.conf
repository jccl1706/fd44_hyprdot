# =========================================================================
# dark - Rosé Pine Moon
# =========================================================================
#
# Read by bin/theme.sh, which fans the values out to quickshell, kitty, GTK,
# btop, hyprlock and Hyprland - see the comment at the top of that script for
# how each one is reloaded.
#
# Plain key=value, no quoting, no shell syntax: this file is parsed by both
# bash and QML, and anything cleverer would have to be implemented twice.
#
# It was Catppuccin Mocha until the desktop's two themes were made one family:
# cream is Rosé Pine Dawn, so dark is now Rosé Pine Moon rather than an
# unrelated palette that happened to sit opposite it. The wallpaper this theme
# has always switched to is rose-pine-funky-shapes.webp, which finally matches
# what it is drawn on.
#
# THE MEASURED VALUES WERE RE-DERIVED, NOT COPIED. Several keys here are
# chosen by a number rather than by eye, and transplanting Mocha's would have
# quietly undone the work behind them. Each one says what it was measured
# against below.

name=dark
# Drives gsettings color-scheme, and tells GTK apps which way to render.
appearance=dark

# The wallpaper this theme switches to. Named, not a path: bin/wallpaper.sh
# resolves it against wallpapers/. Delete the key and theme.sh leaves whatever
# you picked in the picker alone.
wallpaper=rose-pine-funky-shapes.webp

# Icon theme for GTK apps (Nautilus, file dialogs). Reversal, installed by
# bin/icon-theme.sh; theme.sh falls back to Adwaita while it is not installed.
# The -dark variant draws light symbolic icons for dark surfaces.
#
# purple, matching this palette's iris accent - and the same colour set cream
# already names, so the two themes differ only in light and dark rather than
# in hue. bin/icon-theme.sh installs exactly the variants the palettes ask
# for, so it needs a run after this change.
icon_theme=Reversal-purple-dark

# GTK theme for GTK3 apps - Thunar, and the portal's file dialogs. Installed by
# bin/gtk-theme.sh; bin/theme.sh falls back to Adwaita while it is not there.
#
# A NAMED THEME IS THE ONLY WAY GTK FOLLOWS A LIVE SWITCH. GTK never re-reads
# a user stylesheet, but GTK3 reloads when gtk-theme-name changes - so the
# colours have to arrive as a theme rather than as generated CSS. The same
# directory also carries the GTK4 stylesheet that theme.sh copies into
# ~/.config/gtk-4.0/gtk.css for libadwaita apps, which follow neither.
#
# Moon, matching this palette exactly - it IS Rosé Pine Moon.
gtk_theme=rose-pine-moon-gtk

# --- quickshell (bar, frame, launcher, power menu) ---------------------
# Rosé Pine Moon: base, text, muted.
bg=#232136
fg=#e0def4
dim=#6e6a86

# iris, Rosé Pine's own violet, and it is here because it earns its place
# rather than because it is pretty. The bar's focused workspace pill has to
# stand out against an UNFOCUSED one, and that is a contrast figure, not a
# taste: 4.67:1 against surfaceHigh below, where the Catppuccin accent it
# replaces managed 4.41:1. So the focus signal is slightly stronger than
# before, in a colour of the same violet family cream uses for its own accent
# (#545176).
#
# The alternatives were measured too: foam 5.74:1 and gold 5.96:1 both clear
# the bar and are the wrong family; rose 4.45:1 is marginal; subtle 3.03:1
# fails outright and would have made a focused workspace stop looking focused.
accent=#c4a7e7
# Dark, because the accent above is light. accentFg is the text drawn ON the
# accent - the focused workspace number, the launcher's selected row - so the
# two always move together: 7.47:1 here.
accentFg=#232136
# The bar's status icons at rest (speaker, Wi-Fi). `dim`, as they have always
# been on the dark theme; cream gives them its accent instead.
pluginIcon=#6e6a86
danger=#eb6f92
surface=#2a273f
# highlight med and highlight high. surfaceHigh is the unfocused workspace
# pill the accent above is measured against; outline is the hairline, and has
# to be lighter than the surface it edges.
surfaceHigh=#44415a
outline=#56526e
panelTop=#2a273f

# The hairline highlight along a pill's top edge. White at low alpha on a
# dark theme; on a light one it has to become a dark line instead, or it is
# invisible - which is why this is a colour and an alpha, not a constant.
rim=#ffffff
rimAlpha=0.055

# The top of a pill's gradient - it is lit from above. Given explicitly rather
# than computed, because the Qt.lighter(surface, 1.28) this replaces works on
# a dark theme and has nowhere to go on a light one. #363251 is exactly what
# that factor produces from this theme's surface, by the same arithmetic that
# produced Mocha's #26263b from its own.
surfaceTop=#363251

# Panel translucency. Light themes need more opacity to stay readable over
# a bright wallpaper.
panelAlpha=0.85

# --- kitty -------------------------------------------------------------
term_bg=#232136
term_fg=#e0def4
# rose, the counterpart of Mocha's rosewater cursor.
term_cursor=#ea9a97
term_sel_bg=#44415a
term_sel_fg=#e0def4
term_opacity=0.92

# Rosé Pine's own terminal mapping, which is not the obvious one and is
# deliberate: the palette HAS NO GREEN, so the green slot carries pine (a
# teal), blue carries foam and cyan carries rose. cream already maps its
# colours this way, so the two themes agree.
#
# One consequence worth knowing, because bin/theme.sh builds btop's load
# gradients out of colours 2, 3 and 1: those meters run pine to gold to love
# rather than the traffic-light green-yellow-red. Low still reads cool and
# high still reads hot; it is simply the reading this palette allows.
term_color0=#393552
term_color8=#6e6a86
term_color1=#eb6f92
term_color9=#eb6f92
term_color2=#3e8fb0
term_color10=#3e8fb0
term_color3=#f6c177
term_color11=#f6c177
term_color4=#9ccfd8
term_color12=#9ccfd8
term_color5=#c4a7e7
term_color13=#c4a7e7
term_color6=#ea9a97
term_color14=#ea9a97
term_color7=#e0def4
term_color15=#e0def4

# --- hyprland ----------------------------------------------------------
# Borders are disabled (border_size = 0), so these only show if that is
# ever turned back on. Kept in the theme so turning it on does not mean
# rediscovering which colours belong to which palette.
# A two-stop gradient, matching the shape look.lua declares: pine to foam,
# the direct counterpart of Mocha's blue to teal.
border_active_a=rgba(3e8fb0ee)
border_active_b=rgba(9ccfd8ee)
border_angle=45
border_inactive=rgba(56526eaa)
shadow=0xee1a1a1a
# --- browser -----------------------------------------------------------
# Seed colour for Chromium's theme, via the BrowserThemeColor enterprise
# policy (see bin/chrome-theme.sh). NOT a literal colour: Chromium keeps the
# hue, roughly doubles the saturation, and derives light or dark chrome from
# the seed's own lightness.
#
# highlight high, the structural counterpart of Mocha's surface2 (#585b70):
# the same muted-indigo role at very nearly the same lightness, so it should
# generate dark chrome for the same reason. THE ONE VALUE HERE NOT VERIFIED
# BY MEASUREMENT - the original was chosen by what Chromium actually produced
# from it, and that check needs the browser and root. If the chrome comes out
# light, this is the key to move.
browser_seed=#56526e

# Shadow under the lock screen's card. Low-alpha black on BOTH themes: a
# shadow tinted with the palette stops reading as shade and starts reading as
# a coloured halo. Only the alpha differs - a cream surface needs a fainter
# one to avoid looking grubby.
lock_shadow=00000066
