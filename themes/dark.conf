# =========================================================================
# dark - Adwaita
# =========================================================================
#
# Read by bin/theme.sh, which fans the values out to quickshell, kitty, btop,
# GTK and hyprlock - see the comment at the top of that script for how each
# one is reloaded.
#
# Plain key=value, no quoting, no shell syntax: this file is parsed by both
# bash and QML, and anything cleverer would have to be implemented twice.
#
# WHY ADWAITA AND NOT A PALETTE OF ITS OWN. GTK apps here are stock Adwaita
# and do not follow this file. Making them follow it was tried twice and both
# routes had a price: overriding libadwaita's named colours in
# ~/.config/gtk-4.0/gtk.css costs the live light/dark switch, because GTK
# reads that file once at startup and pinning those names leaves it nothing to
# swap; and a named GTK3 theme works live but only reaches GTK3, which meant
# replacing the file manager with one that looks its age.
#
# So the desktop moves to GTK rather than the other way round. Every value
# below is either one of libadwaita's own named colours or a GNOME palette
# colour, which is why the terminal, the bar, the lock screen and a Nautilus
# window are now the same surface rather than four near-misses.
#
# The values that are MEASURED rather than chosen are still measured - see the
# accent and surfaceTop below.

name=dark
# Drives gsettings color-scheme, and tells GTK apps which way to render.
appearance=dark

# The wallpaper this theme switches to. Named, not a path: bin/wallpaper.sh
# resolves it against wallpapers/. Delete the key and theme.sh leaves whatever
# you picked in the picker alone.
#
# THE ONE THING HERE THAT NO LONGER MATCHES. This is a Rosé Pine wallpaper
# under an Adwaita palette, kept because a wallpaper is taste rather than
# theming and changing it was not asked for. wallpapers/ has Tokyo Night and
# Catppuccin sets that would sit better against grey and blue.
wallpaper=rose-pine-funky-shapes.webp

# Icon theme for GTK apps (Nautilus, file dialogs). Reversal, installed by
# bin/icon-theme.sh; theme.sh falls back to Adwaita while it is not installed.
# Grey, which is the neutral choice against a palette that is greys and one
# blue - Reversal has a blue set if the accent should be echoed in the folders.
icon_theme=Reversal-grey-dark

# --- quickshell (bar, frame, launcher, power menu) ---------------------
# libadwaita's own names: view_bg_color, window_fg_color, and the disabled
# grey from the GNOME palette (Light 5).
#
# bg is view_bg_color - the LARGE surface, the one a Nautilus content area and
# a terminal both draw. window_bg_color (#242424) is the smaller chrome around
# it and is `surface` below.
bg=#1e1e1e
fg=#ffffff
dim=#9a9996

# accent_color, which is libadwaita's own accent for TEXT on dark - not
# accent_bg_color (#3584e4), the fill behind white text. The distinction
# matters here because this accent is measured against the bar's unfocused
# workspace pill, and only one of them passes:
#
#   accent_color #78aeed   vs pill #303030   5.70:1   <- this
#   accent_bg    #3584e4   vs pill           3.50:1   fails
#
# For scale: the Catppuccin accent this replaces managed 4.41:1, so the focus
# signal is stronger than it has ever been.
accent=#78aeed
# Dark, because the accent above is light. accentFg is the text drawn ON the
# accent - the focused workspace number, the launcher's selected row - so the
# two always move together: 7.21:1 here.
accentFg=#1e1e1e
# The bar's status icons at rest (speaker, Wi-Fi). `dim`, as they have always
# been on the dark theme; cream gives them its accent instead.
pluginIcon=#9a9996
# destructive_color, libadwaita's red for text on dark. Not
# destructive_bg_color (#c01c28), which is the fill and too dark to read
# against this background.
danger=#ff7b63
# window_bg_color and headerbar_bg_color. surfaceHigh is the unfocused
# workspace pill the accent above is measured against.
surface=#242424
surfaceHigh=#303030
# libadwaita draws its borders as 12% white over the window background, which
# resolves to this. Given as a flat colour because quickshell needs one.
outline=#3e3e3e
panelTop=#242424

# The hairline highlight along a pill's top edge. White at low alpha on a
# dark theme; on a light one it has to become a dark line instead, or it is
# invisible - which is why this is a colour and an alpha, not a constant.
rim=#ffffff
rimAlpha=0.055

# The top of a pill's gradient - it is lit from above. Given explicitly rather
# than computed, because the Qt.lighter(surface, 1.28) this replaces works on
# a dark theme and has nowhere to go on a light one. #2e2e2e is exactly what
# that factor produces from this theme's surface.
surfaceTop=#2e2e2e

# Panel translucency. Light themes need more opacity to stay readable over
# a bright wallpaper.
panelAlpha=0.85

# --- kitty -------------------------------------------------------------
# GNOME Terminal's own palette, so a terminal and a Nautilus window are the
# same surface rather than two dark greys that nearly agree. term_bg is bg:
# under Adwaita they are the same colour, which they were not before.
term_bg=#1e1e1e
term_fg=#ffffff
term_cursor=#ffffff
# accent_bg_color with white on it - libadwaita's selection, 3.77:1, which is
# what GTK itself uses for selected text.
term_sel_bg=#3584e4
term_sel_fg=#ffffff
term_opacity=0.92

term_color0=#1e1e1e
term_color8=#5e5c64
term_color1=#c01c28
term_color9=#ed333b
term_color2=#2ec27e
term_color10=#57e389
term_color3=#f5c211
term_color11=#f8e45c
term_color4=#1e78e4
term_color12=#51a1ff
term_color5=#9841bb
term_color13=#c061cb
term_color6=#0ab9dc
term_color14=#4fd2fd
term_color7=#c0bfbc
term_color15=#f6f5f4

# --- hyprland ----------------------------------------------------------
# Borders are disabled (border_size = 0), so these only show if that is
# ever turned back on. Kept in the theme so turning it on does not mean
# rediscovering which colours belong to which palette.
# accent_bg_color to accent_color - the fill blue lifting to the text blue,
# which is the only gradient this palette suggests on its own.
border_active_a=rgba(3584e4ee)
border_active_b=rgba(78aeedee)
border_angle=45
border_inactive=rgba(3e3e3eaa)
shadow=0xee1a1a1a
# --- browser -----------------------------------------------------------
# Seed colour for Chromium's theme, via the BrowserThemeColor enterprise
# policy (see bin/chrome-theme.sh). NOT a literal colour: Chromium keeps the
# hue, roughly doubles the saturation, and derives light or dark chrome from
# the seed's own lightness.
#
# headerbar_bg_color, which is what Chromium's own chrome is standing in for.
# THE ONE VALUE HERE NOT VERIFIED BY MEASUREMENT - the Catppuccin seed it
# replaces was chosen by what Chromium actually produced from it, and that
# check needs the browser and root. A near-neutral grey should produce grey
# chrome; if it comes out tinted, this is the key to move.
browser_seed=#303030

# Shadow under the lock screen's card. Low-alpha black on BOTH themes: a
# shadow tinted with the palette stops reading as shade and starts reading as
# a coloured halo. Only the alpha differs - a cream surface needs a fainter
# one to avoid looking grubby.
lock_shadow=00000066
