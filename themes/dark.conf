# =========================================================================
# dark - Catppuccin Mocha
# =========================================================================
#
# The palette this desktop was built against. Read by bin/theme.sh, which
# fans the values out to quickshell, kitty, GTK and Hyprland - see the
# comment at the top of that script for how each one is reloaded.
#
# Plain key=value, no quoting, no shell syntax: this file is parsed by both
# bash and QML, and anything cleverer would have to be implemented twice.

name=dark
# Drives gsettings color-scheme, and tells GTK apps which way to render.
appearance=dark

# --- quickshell (bar, frame, launcher, power menu) ---------------------
bg=#11111b
fg=#cdd6f4
dim=#6c7086
accent=#89b4fa
accentFg=#11111b
danger=#f38ba8
surface=#1e1e2e
surfaceHigh=#313244
outline=#45475a
panelTop=#1e1e2e

# The hairline highlight along a pill's top edge. White at low alpha on a
# dark theme; on a light one it has to become a dark line instead, or it is
# invisible - which is why this is a colour and an alpha, not a constant.
rim=#ffffff
rimAlpha=0.055

# The top of a pill's gradient - it is lit from above. This used to be
# computed as Qt.lighter(surface, 1.28), which works on a dark theme and has
# nowhere to go on a light one, where `surface` is already near-white. Given
# explicitly per theme instead. #26263b is exactly what that factor produced.
surfaceTop=#26263b

# Panel translucency. Light themes need more opacity to stay readable over
# a bright wallpaper.
panelAlpha=0.85

# --- kitty -------------------------------------------------------------
term_bg=#11111b
term_fg=#cdd6f4
term_cursor=#f5e0dc
term_sel_bg=#585b70
term_sel_fg=#cdd6f4
term_opacity=0.92

term_color0=#45475a
term_color8=#585b70
term_color1=#f38ba8
term_color9=#f38ba8
term_color2=#a6e3a1
term_color10=#a6e3a1
term_color3=#f9e2af
term_color11=#f9e2af
term_color4=#89b4fa
term_color12=#89b4fa
term_color5=#f5c2e7
term_color13=#f5c2e7
term_color6=#94e2d5
term_color14=#94e2d5
term_color7=#bac2de
term_color15=#a6adc8

# --- hyprland ----------------------------------------------------------
# Borders are disabled (border_size = 0), so these only show if that is
# ever turned back on. Kept in the theme so turning it on does not mean
# rediscovering which colours belong to which palette.
# A two-stop gradient, matching the shape look.lua declares. Blue to teal,
# both straight out of the palette above - the old hardcoded cyan-to-green
# belonged to no theme in particular.
border_active_a=rgba(89b4faee)
border_active_b=rgba(94e2d5ee)
border_angle=45
border_inactive=rgba(45475aaa)
shadow=0xee1a1a1a
