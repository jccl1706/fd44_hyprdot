# =========================================================================
# dark - Catppuccin Mocha
# =========================================================================
#
# The palette this desktop was built against. Read by bin/theme.sh, which
# fans the values out to quickshell, kitty, GTK and Hyprland - see the
# comment at the top of that script for how each one is reloaded.
#
# Plain key=value, no quoting, no shell syntax: this file is parsed by both
# bash and QML, and anything cleverer would have to be implemented twice.

name=dark
# Drives gsettings color-scheme, and tells GTK apps which way to render.
appearance=dark

# The wallpaper this theme switches to. Named, not a path: bin/wallpaper.sh
# resolves it against wallpapers/. Delete the key and theme.sh leaves whatever
# you picked in the picker alone.
# Muted pastel shapes on a dark ground - what this palette was chosen against.
wallpaper=rose-pine-funky-shapes.webp

# Icon theme for GTK apps (Nautilus, file dialogs). Reversal, installed by
# bin/icon-theme.sh; theme.sh falls back to Adwaita while it is not installed.
# The -dark variant draws light symbolic icons for dark surfaces. Grey folders,
# the nearest of Reversal's twelve colours to this palette's lavender-grey
# accent (#a6adc9).
icon_theme=Reversal-grey-dark

# --- quickshell (bar, frame, launcher, power menu) ---------------------
bg=#11111b
fg=#cdd6f4
dim=#6c7086
# The browser's hue, not its exact colour - and the difference matters.
# Chromium renders its active tab as #505465 here, and cream matches its own
# browser exactly because #545176 is dark against a light bar and so stands
# out. The same trick fails on a dark theme: #505465 sits inside this theme's
# own tonal range, giving 1.30:1 against an unfocused workspace pill, so the
# focused workspace stopped looking focused at all.
#
# So: the browser's hue (229 degrees) lifted until it earns its place. 4.41:1
# against an unfocused pill, where the Catppuccin blue it replaces managed
# 4.65:1 - the focus signal is kept, and the colour is still visibly the
# browser's family rather than an unrelated blue.
accent=#a6adc9
# Dark, because the accent above is light. accentFg is the text drawn ON the
# accent - the focused workspace number, the launcher's selected row - so the
# two always move together: 8.43:1 here.
accentFg=#11111b
# The bar's status icons at rest (speaker, Wi-Fi). `dim`, as they have always
# been here; cream gives them its accent instead.
pluginIcon=#6c7086
danger=#f38ba8
surface=#1e1e2e
surfaceHigh=#313244
outline=#45475a
panelTop=#1e1e2e

# The hairline highlight along a pill's top edge. White at low alpha on a
# dark theme; on a light one it has to become a dark line instead, or it is
# invisible - which is why this is a colour and an alpha, not a constant.
rim=#ffffff
rimAlpha=0.055

# The top of a pill's gradient - it is lit from above. This used to be
# computed as Qt.lighter(surface, 1.28), which works on a dark theme and has
# nowhere to go on a light one, where `surface` is already near-white. Given
# explicitly per theme instead. #26263b is exactly what that factor produced.
surfaceTop=#26263b

# Panel translucency. Light themes need more opacity to stay readable over
# a bright wallpaper.
panelAlpha=0.85

# --- kitty -------------------------------------------------------------
term_bg=#11111b
term_fg=#cdd6f4
term_cursor=#f5e0dc
term_sel_bg=#585b70
term_sel_fg=#cdd6f4
