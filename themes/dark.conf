# --- hyprland ----------------------------------------------------------
# Borders are disabled (border_size = 0), so these only show if that is
# ever turned back on. Kept in the theme so turning it on does not mean
# rediscovering which colours belong to which palette.
# A two-stop gradient, matching the shape look.lua declares. Blue to teal,
# both straight out of the palette above - the old hardcoded cyan-to-green
# belonged to no theme in particular.
border_active_a=rgba(89b4faee)
border_active_b=rgba(94e2d5ee)
border_angle=45
border_inactive=rgba(45475aaa)
shadow=0xee1a1a1a
# --- browser -----------------------------------------------------------
# Seed colour for Chromium's theme, via the BrowserThemeColor enterprise
# policy (see bin/chrome-theme.sh). NOT a literal colour: Chromium keeps the
# hue, roughly doubles the saturation, and derives light or dark chrome from
# the seed's own lightness. Measured, seeding #faf4ed produced #f1dfc9 and
# seeding #575279 produced #36344c - so this is chosen by what it GENERATES,
# not by what it looks like.
#
# It is a separate key rather than a reference to one of the tokens above
# because no single token works for both themes: a dark seed is wanted in
# each, and `fg` is dark on cream but light on dark.
# Catppuccin surface2 - the direct counterpart of cream's choice: the same
# muted-indigo role, at a lightness that keeps the chrome dark here too.
browser_seed=#585b70

# Shadow under the lock screen's card. Low-alpha black on BOTH themes: a
# shadow tinted with the palette stops reading as shade and starts reading as
# a coloured halo. Only the alpha differs - a cream surface needs a fainter
# one to avoid looking grubby.
lock_shadow=00000066
