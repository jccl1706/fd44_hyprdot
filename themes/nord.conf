# =========================================================================
# nord
# =========================================================================
#
# Read by bin/theme.sh, which fans the values out to quickshell, kitty, btop,
# GTK and hyprlock - see the comment at the top of that script for how each one
# is reloaded. Plain key=value, no quoting, no shell syntax: this file is parsed
# by both bash and QML, and anything cleverer would have to be implemented twice.
#
# EVERY COLOUR BELOW IS AN OFFICIAL NORD VALUE, not an approximation chosen to
# look right beside one. The palette is published as sixteen colours in four
# named groups and the whole point of using it is that they were picked
# together; mixing in a hand-tuned shade undoes that and is invisible until two
# of them sit adjacent.
#
#   Polar Night  nord0 #2e3440  nord1 #3b4252  nord2 #434c5e  nord3 #4c566a
#   Snow Storm   nord4 #d8dee9  nord5 #e5e9f0  nord6 #eceff4
#   Frost        nord7 #8fbcbb  nord8 #88c0d0  nord9 #81a1c1  nord10 #5e81ac
#   Aurora       nord11 #bf616a (red)     nord12 #d08770 (orange)
#                nord13 #ebcb8b (yellow)  nord14 #a3be8c (green)
#                nord15 #b48ead (purple)
#
#   https://www.nordtheme.com/docs/colors-and-palettes
#
# NORD'S TEXT TIERS ARE DELIBERATELY CLOSE TOGETHER, which is the one place this
# theme reads differently from catppuccin. Catppuccin separates text (#cdd6f4)
# from subtext (#a6adc8) by a wide margin; Nord's three Snow Storm shades sit
# within a few percent of each other on purpose, so the hierarchy here is
# carried by weight and spacing more than by contrast. fg is nord6 and dim is
# nord4 rather than something darker, because dim is SECONDARY TEXT in about a
# hundred places across the panels - not a border colour. nord3, the shade Nord
# itself reserves for comments, is used below for outline and hover surfaces
# where a dark grey belongs and nothing has to be read off it.
#
# LIKE catppuccin AND UNLIKE dark.conf, THIS DOES NOT FOLLOW ADWAITA. dark.conf
# uses GNOME's own colours so a Nautilus window and the bar are the same surface
# rather than two near-misses. No Nord GTK stylesheet is installed here, so GTK
# apps stay Adwaita-dark and will not match: a Nautilus window beside this bar
# is a deliberate contrast, not a mistake. The theme to install if that grates
# is Nordic (github.com/EliverLara/Nordic), and then appearance= and the GTK
# side would want revisiting.

name=nord
appearance=dark

# One of the three nord-* wallpapers already in wallpapers/. The others are
# nord-black-moon.webp and nord-city-view.webp, both Polar Night enough to
# swap in without touching anything else.
wallpaper=nord-night-hawks.webp

# Frost is the accent, and Papirus has no Frost-tinted folder variant, so the
# plain dark set is the honest choice rather than a blue that is not Nord's.
# A REAL NORD GTK THEME, which the other palettes do not have. Nordic is built
# on the Nord palette rather than being Adwaita with its named colours
# overridden, so Nautilus, file dialogs and GTK app chrome match the bar
# instead of being a deliberate near-miss the way catppuccin.conf describes.
#
# NORDIC IS USED FOR GTK3 ONLY, and that is deliberate. It ships a complete
# gtk-4.0/gtk.css which theme.sh used to copy for libadwaita; written for GTK
# 4.6 in 2022, it threw 42 Gtk-CRITICAL parse assertions per Nautilus start on
# GTK 4.22 and rendered wrong rather than unthemed. theme.sh now generates
# libadwaita's named colours from this palette instead, which is both supported
# and the reason every other palette reaches GTK4 apps too.
#
# NORDZY'S PLAIN DARK SET, NOT ITS CYAN ONE, and that was decided by looking at
# both rather than by reasoning about them. The cyan set echoes the accent
# (#88c0d0) and is the obvious choice on paper - but on screen its folders are
# the loudest thing in the window, which fights the whole point of Nord. Nord is
# a deliberately low-contrast palette; the dark set's slate folders sit inside
# it instead of on top of it. Nordzy-cyan-dark is still there upstream if the
# file manager should stand out rather than blend.
#
# NEITHER IS A FEDORA PACKAGE and both Nordzy COPRs are dead - alvatip last
# failed to build in 2023, rubemlrm last succeeded in 2024. bin/gtk-theme.sh
# fetches pinned, checksummed releases into ~/.local/share, and theme.sh falls
# back to Adwaita-dark with a message while they are absent, so a machine
# without them is unthemed rather than broken.
gtk_theme=Nordic
icon_theme=Nordzy-dark

bg=#2e3440
fg=#eceff4
dim=#d8dee9
accent=#88c0d0
accentFg=#2e3440
pluginIcon=#d8dee9
danger=#bf616a

# Polar Night in order: nord1, nord2, nord3. The gradient on every pill is
# surfaceTop over surface - "lit from above", as Theme.qml puts it - and
# surfaceHigh is the hover state, so it has to be lighter than both. Nord's
# four Polar Night shades map onto this exactly, which is lucky and the reason
# no blending is needed anywhere in this file.
surface=#3b4252
surfaceTop=#434c5e
surfaceHigh=#4c566a
outline=#434c5e
panelTop=#3b4252
rim=#ffffff
rimAlpha=0.055
panelAlpha=1

# --- the terminal ---------------------------------------------------------
#
# Nord's own published terminal mapping. Note colour0 is nord1 and not nord0:
# a black that matches the background makes black text invisible, which is why
# every Nord port does this - the same reason catppuccin.conf uses surface1.
#
# Nord publishes no second set of eight, so the bright half follows the usual
# convention in Nord terminal themes: a lighter Polar Night for bright black,
# the other Frost teal for bright cyan, the brightest Snow Storm for bright
# white, and the Aurora colours UNCHANGED - because an "intense" Aurora red
# would be a colour Nord does not define.
term_bg=#2e3440
term_fg=#d8dee9
term_cursor=#d8dee9
term_sel_bg=#434c5e
term_sel_fg=#eceff4
term_opacity=0.92
term_color0=#3b4252
term_color8=#4c566a
term_color1=#bf616a
term_color9=#bf616a
term_color2=#a3be8c
term_color10=#a3be8c
term_color3=#ebcb8b
term_color11=#ebcb8b
term_color4=#81a1c1
term_color12=#81a1c1
term_color5=#b48ead
term_color13=#b48ead
term_color6=#88c0d0
term_color14=#8fbcbb
term_color7=#e5e9f0
term_color15=#eceff4

# --- the compositor -------------------------------------------------------
#
# The active border runs nord8 to nord10 - the two ends of Frost, which is the
# pairing Nord's own materials use for emphasis. Inactive is nord2, barely
# there. The shadow is nord0 itself: Nord has nothing darker than its own
# background, so a shadow here reads as depth rather than as a black halo.
border_active_a=rgba(88c0d0ee)
border_active_b=rgba(5e81acee)
border_angle=45
border_inactive=rgba(434c5eaa)
shadow=0xee2e3440
browser_seed=#3b4252
lock_shadow=00000066
