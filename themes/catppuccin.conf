# =========================================================================
# catppuccin - Mocha
# =========================================================================
#
# Read by bin/theme.sh, which fans the values out to quickshell, kitty, btop,
# GTK and hyprlock - see the comment at the top of that script for how each one
# is reloaded. Plain key=value, no quoting, no shell syntax: this file is parsed
# by both bash and QML, and anything cleverer would have to be implemented twice.
#
# MOCHA, OF THE FOUR FLAVOURS. Latte is the light one and would be a second file
# rather than a variant of this; Frappe and Macchiato sit between the two and
# would be more themes to keep in step for very little difference on screen.
#
# EVERY COLOUR BELOW IS AN OFFICIAL MOCHA VALUE, not an approximation chosen to
# look right beside one. The palette is published as 26 named colours and the
# whole point of using it is that they were picked together; mixing in a
# hand-tuned shade undoes that and is invisible until two of them sit adjacent.
#
#   base #1e1e2e   mantle #181825   crust #11111b
#   surface0 #313244   surface1 #45475a   surface2 #585b70
#   overlay0 #6c7086   overlay1 #7f849c   overlay2 #9399b2
#   subtext0 #a6adc8   subtext1 #bac2de   text #cdd6f4
#   mauve #cba6f7   blue #89b4fa   red #f38ba8   green #a6e3a1
#
# UNLIKE dark.conf, THIS DOES NOT FOLLOW ADWAITA. The dark theme uses GNOME's
# own colours so that a Nautilus window and the bar are the same surface rather
# than two near-misses. Catppuccin has no GTK stylesheet installed here, so GTK
# apps stay Adwaita and will not match: a Nautilus window beside this bar is a
# deliberate contrast, not a mistake. If that grates, catppuccin-gtk is the
# thing to install, and then appearance= and the GTK side would need revisiting.

name=catppuccin
appearance=dark

# One of the four already in wallpapers/, and the only one of them whose
# palette is Mocha rather than Latte.
wallpaper=catppuccin-waves.webp

# Mauve is the accent, so the folders match it. bin/icon-theme.sh installs the
# variants a palette names and deletes the rest.
icon_theme=Hatter

bg=#1e1e2e
fg=#cdd6f4
dim=#a6adc8
accent=#cba6f7
accentFg=#1e1e2e
pluginIcon=#a6adc8
danger=#f38ba8

# surface0/1/2, in order. The gradient on every pill is surfaceTop over
# surface - "lit from above", as Theme.qml puts it - and surfaceHigh is the
# hover state, so it has to be lighter than both.
surface=#313244
surfaceTop=#45475a
surfaceHigh=#585b70
outline=#45475a
panelTop=#313244
rim=#ffffff
rimAlpha=0.055
panelAlpha=0.85

# --- the terminal ---------------------------------------------------------
#
# The official Catppuccin Mocha terminal mapping. Note colour0 is surface1 and
# not base: a black that matches the background makes black text invisible,
# which is why every Catppuccin port does this.
term_bg=#1e1e2e
term_fg=#cdd6f4
term_cursor=#f5e0dc
term_sel_bg=#585b70
term_sel_fg=#cdd6f4
term_opacity=0.92
term_color0=#45475a
term_color8=#585b70
term_color1=#f38ba8
term_color9=#f38ba8
term_color2=#a6e3a1
term_color10=#a6e3a1
term_color3=#f9e2af
term_color11=#f9e2af
term_color4=#89b4fa
term_color12=#89b4fa
term_color5=#f5c2e7
term_color13=#f5c2e7
term_color6=#94e2d5
term_color14=#94e2d5
term_color7=#bac2de
term_color15=#a6adc8

# --- the compositor -------------------------------------------------------
#
# The active border is a mauve-to-blue gradient, which is the pairing
# Catppuccin's own materials use; inactive is surface1, barely there.
border_active_a=rgba(cba6f7ee)
border_active_b=rgba(89b4faee)
border_angle=45
border_inactive=rgba(45475aaa)
shadow=0xee11111b
browser_seed=#313244
lock_shadow=00000066
