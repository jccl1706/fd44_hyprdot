# =========================================================================
# catppuccin-latte - the light flavour
# =========================================================================
#
# Read by bin/theme.sh, which fans the values out to quickshell, kitty, btop,
# GTK and hyprlock. Plain key=value, parsed by both bash and QML.
#
# THE LIGHT TWIN OF catppuccin.conf, and not a mechanical inversion of it. The
# conventions a light palette needs here are taken from cream.conf, which worked
# them out: the rim is BLACK at a low alpha rather than white (a white rim on a
# light surface is invisible), panels are more opaque because a translucent light
# panel over a bright wallpaper turns to mush, and the terminal's black is a grey
# light enough to read dark text against.
#
#   base #eff1f5   mantle #e6e9ef   crust #dce0e8
#   surface0 #ccd0da   surface1 #bcc0cc   surface2 #acb0be
#   overlay0 #9ca0b0   overlay1 #8c8fa1   overlay2 #7c7f93
#   subtext0 #6c6f85   subtext1 #5c5f77   text #4c4f69
#   mauve #8839ef   blue #1e66f5   red #d20f39   green #40a02b
#
# WHERE IT DIVERGES FROM MOCHA'S MAPPING, and why: in Mocha the surfaces climb
# AWAY from the background (surface0 is lighter than base) because a dark theme
# lifts a panel by lightening it. Latte's surface0/1/2 climb away from base in
# the same direction - they get DARKER relative to white, not lighter - so using
# them for surfaceTop would make every pill darker than the bar it sits on. The
# pills therefore take base and mantle, and surface0/1 become the outline and the
# hover state, which is where their contrast is wanted.

name=catppuccin-latte
appearance=light

# The Latte wallpaper that is already in wallpapers/ - the other three are Mocha.
wallpaper=catppuccin-latte-color-fade.webp

icon_theme=Reversal-purple

bg=#eff1f5
fg=#4c4f69
dim=#6c6f85
accent=#8839ef
accentFg=#eff1f5
pluginIcon=#6c6f85
danger=#d20f39

# base for the pill, mantle beneath it - the gradient runs light to slightly
# darker, which is "lit from above" on a light theme. surface0 is the hover.
surface=#eff1f5
surfaceTop=#ffffff
surfaceHigh=#e6e9ef
outline=#ccd0da
panelTop=#eff1f5

# BLACK, NOT WHITE, and this is the one value that cannot be copied from the
# dark file: a white rim on a light surface draws nothing at all.
rim=#000000
rimAlpha=0.05
panelAlpha=0.93

# --- the terminal ---------------------------------------------------------
#
# The official Latte mapping. colour0 is surface1 rather than base for the same
# reason Mocha's is surface1: a black that matches the background makes black
# text invisible.
term_bg=#eff1f5
term_fg=#4c4f69
term_cursor=#dc8a78
term_sel_bg=#acb0be
term_sel_fg=#4c4f69
term_opacity=0.95
term_color0=#bcc0cc
term_color8=#acb0be
term_color1=#d20f39
term_color9=#d20f39
term_color2=#40a02b
term_color10=#40a02b
term_color3=#df8e1d
term_color11=#df8e1d
term_color4=#1e66f5
term_color12=#1e66f5
term_color5=#ea76cb
term_color13=#ea76cb
term_color6=#179299
term_color14=#179299
term_color7=#5c5f77
term_color15=#6c6f85

# --- the compositor -------------------------------------------------------
border_active_a=rgba(8839efee)
border_active_b=rgba(1e66f5ee)
border_angle=45
border_inactive=rgba(ccd0daaa)
shadow=0x339ca0b0
browser_seed=#e6e9ef
lock_shadow=00000026
