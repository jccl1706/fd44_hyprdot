# =========================================================================
# cream - Rosé Pine Dawn
# =========================================================================
#
# The light counterpart to dark.conf. Warm rather than white: the base is
# #faf4ed, not #ffffff, because a full-white desktop against a dark frame is
# harsh and shows every bit of antialiasing on the chrome.
#
# Same keys as dark.conf, in the same order. bin/theme.sh reads whichever of
# the two is selected; a key present in one file and missing from the other
# will read as empty, so the two must stay in step.

name=cream
appearance=light

# The wallpaper this theme switches to. Named, not a path: bin/wallpaper.sh
# resolves it against wallpapers/. Delete the key and theme.sh leaves whatever
# you picked in the picker alone.
# Lighter, to match the cream chrome; the dark wallpaper fights it.
wallpaper=catppuccin-waves.webp

# Icon theme for GTK apps - see dark.conf. The light (unsuffixed) variant,
# with purple folders to go with this palette's violet accent (#545176).
icon_theme=Reversal-purple

# GTK theme for GTK3 apps - Thunar, and the portal's file dialogs. Installed by
# bin/gtk-theme.sh; bin/theme.sh falls back to Adwaita while it is not there.
#
# A NAMED THEME IS THE ONLY WAY GTK FOLLOWS A LIVE SWITCH. GTK never re-reads
# a user stylesheet, but GTK3 reloads when gtk-theme-name changes - so the
# colours have to arrive as a theme rather than as generated CSS. The same
# directory also carries the GTK4 stylesheet that theme.sh copies into
# ~/.config/gtk-4.0/gtk.css for libadwaita apps, which follow neither.
#
# Dawn, matching this palette exactly - it IS Rosé Pine Dawn.
gtk_theme=rose-pine-dawn-gtk

# --- quickshell (bar, frame, launcher, power menu) ---------------------
bg=#faf4ed
fg=#575279
dim=#9893a5
# Chromium's tab strip, measured rather than guessed: seeding the browser
# with #575279 makes it render #545176, and the focused workspace pill, the
# launcher's selection, the OSD fill and the logo hover all take this value,
# so the accent and the browser now agree. Was Rosé Pine Dawn's pine (#286983)
# - correct for the palette, but it reads as teal beside a violet browser.
accent=#545176
accentFg=#faf4ed
# The bar's status icons at rest (speaker, Wi-Fi). The accent here - the
# focused workspace's violet - because `dim` on cream is a washed-out
# grey-violet that made them read as disabled.
pluginIcon=#545176
danger=#b4637a
surface=#fffaf3
# highlight-med, not the overlay tone the dark theme's equivalent maps to.
# Rosé Pine Dawn's overlay (#f2e9e1) sits about two percent off `surface`,
# which is enough separation for a hover state and not nearly enough for a
# shape that has to read as an object - the power menu's unselected circles
# all but vanished into their own panel. Contrast on a light theme has to be
# bought deliberately; on a dark one it comes free, because almost anything
# is lighter than the background.
surfaceHigh=#dfdad9
# Pushed one step darker in turn, so a hairline is still distinguishable from
# the surface that just moved onto its old value.
outline=#cecacd
panelTop=#fffaf3

# INVERTED from the dark theme. The rim is the hairline that lifts a pill off
# its background: white at low alpha over dark, and it has to become a dark
# line over cream or it simply is not there.
rim=#000000
rimAlpha=0.05

# Pure white above the cream surface - a small lift, in the same direction as
# the dark theme's, just with far less room to travel.
surfaceTop=#ffffff

# Higher than the dark theme's 0.85. Dark chrome stays readable when it is
# translucent over almost any wallpaper; cream chrome washes out fast.
panelAlpha=0.93

# --- kitty -------------------------------------------------------------
term_bg=#faf4ed
term_fg=#575279
term_cursor=#575279
term_sel_bg=#dfdad9
term_sel_fg=#575279
term_opacity=0.95

term_color0=#f2e9e1
term_color8=#9893a5
term_color1=#b4637a
term_color9=#b4637a
term_color2=#286983
term_color10=#286983
term_color3=#ea9d34
term_color11=#ea9d34
term_color4=#56949f
term_color12=#56949f
term_color5=#907aa9
term_color13=#907aa9
term_color6=#d7827e
term_color14=#d7827e
term_color7=#575279
term_color15=#575279

# --- hyprland ----------------------------------------------------------
border_active_a=rgba(286983ee)
border_active_b=rgba(56949fee)
border_angle=45
border_inactive=rgba(dfdad9aa)
# Far lighter than the dark theme's near-black: a heavy drop shadow under a
# cream panel reads as dirt rather than depth.
shadow=0x33575279
# --- browser -----------------------------------------------------------
# Seed colour for Chromium's theme, via the BrowserThemeColor enterprise
# policy (see bin/chrome-theme.sh). NOT a literal colour: Chromium keeps the
# hue, roughly doubles the saturation, and derives light or dark chrome from
# the seed's own lightness. Measured, seeding #faf4ed produced #f1dfc9 and
# seeding #575279 produced #36344c - so this is chosen by what it GENERATES,
# not by what it looks like.
#
# It is a separate key rather than a reference to one of the tokens above
# because no single token works for both themes: a dark seed is wanted in
# each, and `fg` is dark on cream but light on dark.
# The clock's colour. Dark chrome against the cream desktop is deliberate,
# not an accident of the generator - it was picked by eye over the lighter
# candidates.
browser_seed=#575279

# Shadow under the lock screen's card. Low-alpha black on BOTH themes: a
# shadow tinted with the palette stops reading as shade and starts reading as
# a coloured halo. Only the alpha differs - a cream surface needs a fainter
# one to avoid looking grubby.
lock_shadow=00000026
