# =========================================================================
# cream - Adwaita light
# =========================================================================
#
# Read by bin/theme.sh, which fans the values out to quickshell, kitty, btop,
# GTK and hyprlock - see the comment at the top of that script for how each
# one is reloaded.
#
# Plain key=value, no quoting, no shell syntax: this file is parsed by both
# bash and QML, and anything cleverer would have to be implemented twice.
#
# THE NAME IS HISTORICAL. It was Rosé Pine Dawn, which is a cream, and this is
# white - but `cream` is what the state file, the toggle and any muscle memory
# call it, so renaming the file is a bigger change than it looks.
#
# WHY ADWAITA, the same reasoning as dark.conf: GTK apps here are stock
# Adwaita and do not follow this file, and the two routes to making them
# follow it either cost the live light/dark switch or meant replacing the file
# manager. So the desktop moves to GTK instead, and every token below is a
# libadwaita named colour or a GNOME palette colour.

name=cream
# Drives gsettings color-scheme, and tells GTK apps which way to render.
appearance=light

# The wallpaper this theme switches to. Named, not a path: bin/wallpaper.sh
# resolves it against wallpapers/. Delete the key and theme.sh leaves whatever
# you picked in the picker alone.
#
# Still a Catppuccin wallpaper under an Adwaita palette, as dark still carries
# a Rosé Pine one. Kept because a wallpaper is taste rather than theming.
wallpaper=catppuccin-waves.webp

# Icon theme for GTK apps (Nautilus, file dialogs). Reversal, installed by
# bin/icon-theme.sh; theme.sh falls back to Adwaita while it is not installed.
#
# Grey now, not purple: this palette is greys and one blue, and purple folders
# belonged to a violet accent that is gone. Both themes name a grey set, which
# also means the two share one colour family for the first time.
icon_theme=Reversal-grey

# --- quickshell (bar, frame, launcher, power menu) ---------------------
# libadwaita's light names, measured off a Nautilus window rather than taken
# from documentation:
#
#   content area  #ffffff   view_bg_color   <- bg, the large surface
#   window        #fafafa   window_bg_color <- surface
#   header bar    #ebebeb   headerbar_bg_color <- surfaceHigh, the pill
#
# fg is window_fg_color, which libadwaita defines as 80% black; resolved over
# the background that is #333333, and a palette needs a solid. 12.63:1.
bg=#ffffff
fg=#333333
# GNOME palette Dark 1. 4.50:1 on white - it only just clears, which is what
# "dim" should do.
dim=#77767b

# GNOME palette Blue 5, and NOT libadwaita's own light accent_color, which is
# the one place this palette had to depart from Adwaita's choice. The accent
# is measured against the bar's unfocused workspace pill, and Adwaita's does
# not pass:
#
#   accent_color #1c71d8   vs pill #ebebeb   4.00:1   below the bar
#   accent_bg    #3584e4   vs pill           3.16:1   worse
#   Blue 5       #1a5fb4   vs pill           5.27:1   <- this
#
# Blue 5 is still a GNOME palette colour - the darkest blue in the standard
# set - so this is Adwaita's palette, at the shade that earns its place.
accent=#1a5fb4
# White, because the accent above is dark: 6.29:1 on it.
accentFg=#ffffff
# The bar's status icons at rest. The accent, as this theme has always done -
# dark gives them `dim` instead.
pluginIcon=#1a5fb4
# destructive_color for light. 6.11:1 on white.
danger=#c01c28
surface=#fafafa
surfaceHigh=#ebebeb
# libadwaita draws its light borders as 15% black over the window background,
# which resolves to this.
outline=#d4d4d4
panelTop=#fafafa

# The hairline highlight along a pill's top edge. On a light theme it has to
# be a dark line rather than a white one, or it is invisible - which is why
# this is a colour and an alpha, not a constant.
rim=#000000
rimAlpha=0.05

# The top of a pill's gradient - it is lit from above. On a light theme the
# computed Qt.lighter(surface, 1.28) clamps at white and has nowhere to go,
# which is exactly why this is given explicitly per theme.
surfaceTop=#ffffff

# Panel translucency. Light themes need more opacity than dark ones to stay
# readable over a bright wallpaper.
panelAlpha=0.93

# --- kitty -------------------------------------------------------------
# term_bg is bg: under Adwaita the terminal and a Nautilus content area are
# the same surface, which is the whole point of this palette.
term_bg=#ffffff
term_fg=#333333
term_cursor=#333333
# accent_bg_color with white on it - libadwaita's own selection.
term_sel_bg=#3584e4
term_sel_fg=#ffffff
term_opacity=0.95

# The GNOME palette, with 0 light and 7 dark - the convention a light terminal
# needs, and the one this theme already used. The darker rows serve as the
# normal colours and the standard rows as the bright ones, so both stay
# legible on white.
term_color0=#ebebeb
term_color8=#c0bfbc
term_color1=#c01c28
term_color9=#ed333b
term_color2=#26a269
term_color10=#2ec27e
term_color3=#e5a50a
term_color11=#f5c211
term_color4=#1c71d8
term_color12=#3584e4
term_color5=#813d9c
term_color13=#9141ac
term_color6=#0ab9dc
term_color14=#4fd2fd
term_color7=#333333
term_color15=#241f31

# --- hyprland ----------------------------------------------------------
# Borders are disabled (border_size = 0), so these only show if that is
# ever turned back on. accent_bg_color falling to Blue 5 - the mirror of
# dark's, which lifts instead.
border_active_a=rgba(3584e4ee)
border_active_b=rgba(1a5fb4ee)
border_angle=45
border_inactive=rgba(d4d4d4aa)
shadow=0x33333333
# --- browser -----------------------------------------------------------
# Seed colour for Chromium's theme, via the BrowserThemeColor enterprise
# policy (see bin/chrome-theme.sh). NOT a literal colour: Chromium keeps the
# hue, roughly doubles the saturation, and derives light or dark chrome from
# the seed's own lightness - so a LIGHT seed is what produces light chrome.
#
# headerbar_bg_color, which is what Chromium's chrome is standing in for. NOT
# VERIFIED BY MEASUREMENT, like dark's: the seed that preceded it was chosen
# by what Chromium actually produced, and that check needs the browser and
# root.
browser_seed=#ebebeb

# Shadow under the lock screen's card. Low-alpha black on BOTH themes: a
# shadow tinted with the palette stops reading as shade and starts reading as
# a coloured halo. Only the alpha differs - a light surface needs a fainter
# one to avoid looking grubby.
lock_shadow=00000026
