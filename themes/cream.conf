# =========================================================================
# cream - Rosé Pine Dawn
# =========================================================================
#
# The light counterpart to dark.conf. Warm rather than white: the base is
# #faf4ed, not #ffffff, because a full-white desktop against a dark frame is
# harsh and shows every bit of antialiasing on the chrome.
#
# Same keys as dark.conf, in the same order. bin/theme.sh reads whichever of
# the two is selected; a key present in one file and missing from the other
# will read as empty, so the two must stay in step.

name=cream
appearance=light

# --- quickshell (bar, frame, launcher, power menu) ---------------------
bg=#faf4ed
fg=#575279
dim=#9893a5
accent=#286983
accentFg=#faf4ed
danger=#b4637a
surface=#fffaf3
surfaceHigh=#f2e9e1
outline=#dfdad9
panelTop=#fffaf3

# INVERTED from the dark theme. The rim is the hairline that lifts a pill off
# its background: white at low alpha over dark, and it has to become a dark
# line over cream or it simply is not there.
rim=#000000
rimAlpha=0.05

# Pure white above the cream surface - a small lift, in the same direction as
# the dark theme's, just with far less room to travel.
surfaceTop=#ffffff

# Higher than the dark theme's 0.85. Dark chrome stays readable when it is
# translucent over almost any wallpaper; cream chrome washes out fast.
panelAlpha=0.93

# --- kitty -------------------------------------------------------------
term_bg=#faf4ed
term_fg=#575279
term_cursor=#575279
term_sel_bg=#dfdad9
term_sel_fg=#575279
term_opacity=0.95

term_color0=#f2e9e1
term_color8=#9893a5
term_color1=#b4637a
term_color9=#b4637a
term_color2=#286983
term_color10=#286983
term_color3=#ea9d34
term_color11=#ea9d34
term_color4=#56949f
term_color12=#56949f
term_color5=#907aa9
term_color13=#907aa9
term_color6=#d7827e
term_color14=#d7827e
term_color7=#575279
term_color15=#575279

# --- hyprland ----------------------------------------------------------
border_active_a=rgba(286983ee)
border_active_b=rgba(56949fee)
border_angle=45
border_inactive=rgba(dfdad9aa)
# Far lighter than the dark theme's near-black: a heavy drop shadow under a
# cream panel reads as dirt rather than depth.
shadow=0x33575279
