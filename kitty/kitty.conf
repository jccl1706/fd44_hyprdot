# =========================================================================
# kitty
# =========================================================================
#
# Symlinked from ~/.config/kitty, the same arrangement as hypr/ and
# quickshell/. Reload without restarting with ctrl+shift+F5.


# -------------------------------------------------------------------------
# Font
# -------------------------------------------------------------------------
# From the Fedora package jetbrains-mono-fonts - a plain noarch font with no
# dependencies of its own.
#
# NOTE the family is "JetBrains Mono", with a space. There is also a
# "JetBrains Mono NL" (No Ligatures) face in the same package; asking for the
# wrong one is a silent fallback to the default mono font rather than an
# error, which is easy to miss. Check with:  kitty +list-fonts | grep -i jet
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size        11.0

# JetBrains Mono ships programming ligatures (-> == != etc). Set this to
# always-off if you would rather see the individual characters.
disable_ligatures never


# -------------------------------------------------------------------------
# Transparency
# -------------------------------------------------------------------------
# THE BLUR BEHIND THIS COMES FROM HYPRLAND, NOT FROM KITTY.
#
# kitty has a background_blur setting, but it only does anything on macOS and
# KDE - on Hyprland it is the compositor that blurs behind any window with
# transparency, via decoration:blur in hypr/look.lua (enabled, size 3,
# passes 1). Setting it here as well just looks like it is doing something.
#
# 0.92 rather than something more dramatic because this is a terminal: text
# legibility beats the effect. Anything below about 0.85 and the wallpaper
# starts competing with the text for attention.
background_opacity 0.92

# Lets the opacity be nudged live with ctrl+shift+a then m / l, so the value
# above can be tuned by eye instead of by editing and reloading.
dynamic_background_opacity yes


# -------------------------------------------------------------------------
# Padding
# -------------------------------------------------------------------------
# Four values are read in CSS order: TOP RIGHT BOTTOM LEFT.
#
# Space at the top and the left only, so the prompt is not jammed into the
# corner of the window. Right and bottom are left at 0 deliberately - with
# Hyprland's gaps and the quickshell frame already separating the window from
# everything around it, padding on all four sides reads as too much air.
#
# For even padding all round, replace the whole line with:  window_padding_width 10
window_padding_width 10 0 0 12
