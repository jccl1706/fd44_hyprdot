# =========================================================================
# kitty
# =========================================================================
#
# Symlinked from ~/.config/kitty, the same arrangement as hypr/ and
# quickshell/. Reload without restarting with ctrl+shift+F5.


# -------------------------------------------------------------------------
# Font
# -------------------------------------------------------------------------
# TRYING Noto Sans Mono. This is what `fc-match monospace` resolves to on
# Fedora - /etc/fonts/conf.d/57-google-noto-sans-mono.conf sorts ahead of
# 60-jetbrains-mono-fonts.conf - so it is the font Chromium and every GTK app
# already use for code, and quickshell.org's own examples render in it,
# because that site ships no monospace webfont and falls back to the generic
# family.
#
# To go back:  font_family      JetBrains Mono
# From the Fedora package jetbrains-mono-fonts - a plain noarch font with no
# dependencies of its own.
#
# THE FAMILY NAME IS A TRAP IN BOTH CASES. Asking for a face that does not
# exist is a silent fallback to the default mono font rather than an error,
# which is easy to miss. "JetBrains Mono" has a space, and there is also a
# "JetBrains Mono NL" (No Ligatures) in the same package. "Noto Sans Mono" is
# a variable font whose Condensed instances - "Noto Sans Mono Condensed
# Light" and a dozen others - all report the same family, so the plain name
# is the one that gets the regular width. Check with:
#   fc-list "Noto Sans Mono" : family style
font_family      Noto Sans Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size        11.0

# JetBrains Mono ships programming ligatures (-> == != etc). Set this to
# always-off if you would rather see the individual characters. Noto Sans
# Mono has none, so while that is the family above this setting does nothing
# either way - it is left alone so switching back needs one edit, not two.
disable_ligatures never


# -------------------------------------------------------------------------
# Transparency
# -------------------------------------------------------------------------
# THE BLUR BEHIND THIS COMES FROM HYPRLAND, NOT FROM KITTY.
#
# kitty has a background_blur setting, but it only does anything on macOS and
# KDE - on Hyprland it is the compositor that blurs behind any window with
# transparency, via decoration:blur in hypr/look.lua (enabled, size 3,
# passes 1). Setting it here as well just looks like it is doing something.
#
# The value itself now lives in the theme files, because the right opacity
# depends on the palette: dark chrome stays readable when translucent over
# almost any wallpaper, cream chrome washes out and needs more. See the
# include at the bottom of this file.
#
# Whatever the theme picks, it is around 0.92 rather than something more
# dramatic because this is a terminal: text legibility beats the effect.
# Anything below about 0.85 and the wallpaper competes with the text.

# Lets the opacity be nudged live with ctrl+shift+a then m / l, so the value
# above can be tuned by eye instead of by editing and reloading.
dynamic_background_opacity yes


# -------------------------------------------------------------------------
# Padding
# -------------------------------------------------------------------------
# Four values are read in CSS order: TOP RIGHT BOTTOM LEFT.
#
# Left and right match; top has a little; bottom has none.
#
# The right used to be 0, on the argument that Hyprland's gaps and the
# quickshell frame already separate the window from everything around it, so
# padding on all four sides reads as too much air. That holds for the bottom
# and it did not hold for the right, because something does sit hard against
# that edge: tmux's status line is right-aligned, so its hostname pill ended
# up one pixel from the window border while the session pill on the left had
# sixteen. Measured across the status row:
#
#   leftmost pill pixel   16px from the window's left edge
#   rightmost pill pixel   1px from the right edge
#
# Anything right-aligned has the same problem - a long path, a git branch in a
# right prompt - so this is the terminal's to fix rather than tmux's.
#
# The bottom stays 0: the status line is meant to sit on the window's edge,
# and padding under it would leave a strip of wallpaper below the bar.
#
# For even padding all round, replace the whole line with:  window_padding_width 10
window_padding_width 10 12 0 12


# -------------------------------------------------------------------------
# Theme
# -------------------------------------------------------------------------
# Colours and background_opacity come from the active theme, not from this
# file. bin/theme.sh writes theme.conf next to this one out of
# themes/<name>.conf and then sends every running kitty a SIGUSR1, which is
# kitty's documented reload signal - so switching theme recolours open
# terminals instead of only new ones.
#
# LAST IN THE FILE ON PURPOSE. kitty applies settings in the order it reads
# them and the last assignment to a key wins, so an include placed earlier
# would be silently overridden by anything set below it.
#
# `include` of a missing file is not an error in kitty, so a checkout where
# theme.sh has never run still starts - it just comes up in kitty's own
# default colours until the first switch.
include theme.conf

# Close a window when asked, without a confirmation dialog.
#
# The default is -1, which means "ask if a window is running a command, but not
# if it is just sitting at a shell prompt". Kitty can only tell those apart when
# its SHELL INTEGRATION is live, and on NixOS it is not: nixpkgs builds kitty
# with `shell_integration enabled no-rc`, so kitty does not add itself to the
# shell's startup, and nothing else there does either. Every window therefore
# looks busy and closing an empty terminal asks.
#
# Forcing `shell_integration enabled` here does stop the prompt and is the wrong
# fix: kitty then starts bash with its own rcfile, ~/.bashrc never runs, and the
# prompt and colours go with it. That is why nixpkgs chose no-rc.
#
# So the confirmation goes instead. What it costs is the warning when a window
# really is running something - closing one now just closes it.
confirm_os_window_close 0
