# =========================================================================
# tmux - keep a long-running terminal session alive, attach from elsewhere
# =========================================================================
#
# What it is here for: a Claude Code session (or anything long-running) that
# lives on one machine and is picked up from the other over ssh:
#
#   laptop$   tmux new -s claude
#   desktop$  ssh laptop -t tmux attach -t claude      (detach: Ctrl+B, then D)
#
# Linked as ~/.config/tmux -> tmux/ in this repo, which tmux 3.1+ reads
# without a ~/.tmux.conf. Opt-in: the installer does not install tmux.
#
# PASTING. Text pastes normally, local or over ssh - the terminal types it in.
# An IMAGE pasted from another machine does not arrive: the program in the
# pane reads the clipboard of the machine it runs on, not the one you are
# sitting at. Copy the file across (scp) and pass its path instead.

# Scroll with the wheel, click to pick a pane, drag to resize it.
set -g mouse on

# Colours and keys. tmux-256color is what programs inside should see; RGB
# gives them true colour when the outer terminal is kitty. Extended keys let
# combinations like Shift+Enter through as themselves instead of plain Enter.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:extkeys"
set -g extended-keys on
set -g extended-keys-format csi-u

# Text copied in tmux goes to the clipboard of the terminal you are attached
# from (OSC 52) - so over ssh it lands on the desktop you are typing at, not
# on the laptop. kitty accepts it.
set -g set-clipboard on

# A long scrollback: agent sessions print a lot.
set -g history-limit 50000

# The default 500 ms wait after Escape makes Escape feel broken in anything
# that uses it on its own.
set -g escape-time 10
set -g focus-events on

# Windows and panes numbered from 1, matching the keyboard's number row.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Switch windows without the Ctrl+B prefix: Alt+Left/Right for the previous
# and next window, Alt+1..9 to jump straight to one. Alt, not Ctrl, because
# Ctrl+Left/Right is "jump a word" in the shell and in Claude Code's prompt,
# and a root-table binding would take it from every pane. Hyprland binds
# nothing to Alt (its keys use Super), and kitty maps neither. Alt+number on
# a window that does not exist only shows tmux's "can't find window" message.
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# ---- Status bar ----------------------------------------------------------
#
#   (󰆍 claude)  1 claude  (2 build 󰊓)            󰌌 prefix  󰂁 79%  (󰒋 framework)
#
# Pills like the Quickshell bar's: the session on the left, the current window
# highlighted among the others, the machine on the right. Colours are ANSI
# names, never hex, so the bar follows the dark/cream theme the way kitty
# does; the transparent background lets the terminal's own show through.
#
# The rounded pill ends are the powerline half circles U+E0B6 and U+E0B4,
# which kitty draws itself - no font needed for them. The icons are Material
# Design glyphs from Symbols Nerd Font, found by kitty's font fallback. Both
# are written as \u escapes, which tmux expands inside double quotes, so the
# codepoints stay readable here.
#
# The machine's name matters: an attached session over ssh must not be
# mistaken for a local one. Before it, the battery of the machine tmux RUNS
# on - attached over ssh, that is the laptop keeping the session alive, which
# is the one that can run flat under it. On the desktop the script prints
# nothing. It is the lock screen's script (bin/lock-battery.sh), so the T480's
# two batteries are summed the same way in both places; the path goes back
# into this repo through the ~/.config/tmux link, as hyprlock.conf's does
# through ~/.config/hypr. "prefix" shows while Ctrl+B is waiting for its key,
# and 󰊓 marks a zoomed pane (Ctrl+B, Z), which otherwise hides the others
# without a trace.
set -g status-position bottom
set -g status-justify left
set -g status-interval 30
set -g status-style "bg=default,fg=white"

set -g status-left-length 30
set -g status-left "#[fg=magenta]#[fg=black,bg=magenta,bold]\U000F018D #S#[fg=magenta,bg=default,nobold]  "

setw -g window-status-separator " "
setw -g window-status-format "#[fg=brightblack] #I #W#{?window_zoomed_flag, \U000F0293,} "
setw -g window-status-current-format "#[fg=blue]#[fg=black,bg=blue,bold]#I #W#{?window_zoomed_flag, \U000F0293,}#[fg=blue,bg=default,nobold]"

set -g status-right-length 80
set -g status-right "#{?client_prefix,#[fg=yellow#,bold]\U000F030C prefix  #[default],}#[fg=brightblack]#($HOME/.config/tmux/../bin/lock-battery.sh --tmux)#[fg=green]#[fg=black,bg=green,bold]\U000F048B #h#[fg=green,bg=default,nobold]"

# The rest of tmux's chrome in the same colours: the active pane's border in
# the accent, messages and the command prompt as a pill-coloured line, and
# copy-mode selections like the current window.
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "fg=black,bg=yellow"
set -g message-command-style "fg=black,bg=yellow"
setw -g mode-style "fg=black,bg=blue"
set -g display-panes-active-colour blue
set -g display-panes-colour brightblack
setw -g clock-mode-colour blue

# ---- Per-machine overrides, if this machine has any ----------------------
#
# LAST, so it wins. tmux applies these in order and the later setting is the
# one that takes effect, which is what lets a local file change the status bar
# above without editing it.
#
# Not in git, and the same arrangement as hypr/monitors_local.lua: ~/.config
# /tmux is a symlink into this checkout, so a file tmux loads by name lands in
# the repo whether we like it or not. Per machine on purpose - the Framework
# runs konsole and the others run kitty, and the two draw the powerline pill
# ends differently enough to want different answers.
#
# `if-shell -b` so a missing file is silence rather than a config error on
# every machine that has not got one.
if-shell -b '[ -f "$HOME/.config/tmux/tmux_local.conf" ]' \
    'source-file "$HOME/.config/tmux/tmux_local.conf"'
